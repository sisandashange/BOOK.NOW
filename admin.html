<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Portal — BOOK.NOW Founder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --primary:#0f172a;--accent:#2563eb;--bg:#f8fafc;--surface:#fff;
  --text:#0f172a;--muted:#64748b;--border:#e2e8f0;
  --success:#16a34a;--success-bg:#f0fdf4;--warning-bg:#fffbeb;
  --warning:#d97706;--danger:#dc2626;--danger-bg:#fef2f2;--radius:16px;
}
*{box-sizing:border-box;font-family:'Plus Jakarta Sans',sans-serif;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);padding-bottom:50px}
button,input{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.6;cursor:not-allowed}

#auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.auth-card{background:white;padding:28px;border-radius:20px;border:1px solid var(--border);width:100%;max-width:400px}
.auth-title{text-align:center;font-size:20px;font-weight:700;margin-bottom:6px}
.auth-sub{text-align:center;font-size:13px;color:var(--muted);margin-bottom:24px}
.top-nav{background:white;padding:14px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20}
.brand{font-size:16px;font-weight:800;display:flex;align-items:center;gap:7px;color:var(--primary)}
.container{padding:16px;max-width:900px;margin:auto}
.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.section-head h3{font-size:16px;margin:0}
.btn-primary{background:var(--accent);color:white;border:0;padding:12px 14px;border-radius:10px;font-size:13px;font-weight:600;width:100%}
.card-list{display:flex;flex-direction:column;gap:12px}
.vendor-card{background:white;padding:16px;border-radius:14px;border:1px solid var(--border);display:flex;flex-direction:column;gap:10px}
.vendor-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.vendor-title{font-weight:800;font-size:15px}
.vendor-meta{font-size:12px;color:var(--muted);margin-top:2px}
.status-badge{padding:4px 8px;border-radius:6px;font-size:11px;font-weight:700;display:inline-block}
.status-active{background:var(--success-bg);color:var(--success)}
.status-pending{background:var(--warning-bg);color:var(--warning)}
.form-field{margin-bottom:14px}
.form-field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px}
.form-field input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);font-size:14px}
.empty-box{text-align:center;padding:32px 16px;background:white;border-radius:14px;border:1px dashed var(--border);color:var(--muted);font-size:13px}
</style>
</head>
<body>

<div id="auth-screen">
  <div class="auth-card">
    <div class="brand" style="justify-content:center;margin-bottom:16px"><i class="ph ph-shield-check" style="font-size:26px;color:var(--accent)"></i> Founder Admin</div>
    <div class="auth-title">Admin Login</div>
    <div class="auth-sub">Enter founder credentials to manage vendors</div>
    <div class="form-field"><label for="admin-email">Email Address</label><input type="email" id="admin-email" placeholder="founder@booknow.co.za"></div>
    <div class="form-field"><label for="admin-password">Password</label><input type="password" id="admin-password" placeholder="Password"></div>
    <button class="btn-primary" id="admin-login-btn">Sign In to Admin</button>
  </div>
</div>

<div id="admin-dashboard" style="display:none">
  <div class="top-nav">
    <div class="brand"><i class="ph ph-shield-check" style="font-size:20px;color:var(--accent)"></i> BOOK.NOW Founder Control Panel</div>
    <button class="btn-primary" style="width:auto;padding:8px 12px;background:#fee2e2;color:#991b1b" id="admin-logout-btn">Sign Out</button>
  </div>

  <main class="container">
    <div class="section-head">
      <h3>All Registered Vendors &amp; Subscriptions</h3>
      <button class="btn-primary" style="width:auto;padding:8px 12px;" onclick="loadVendorsList()">Refresh List</button>
    </div>
    <div id="vendors-admin-list" class="card-list">
      <div class="empty-box">Loading vendors...</div>
    </div>
  </main>
</div>

<script>
(() => {
  "use strict";
  const SUPABASE_URL = "https://pvplhsiafklaoqrpdhpd.supabase.co";
  const SUPABASE_KEY = "sb_publishable_VKlDPkR9JvJr6E4bcz1HSg_OG5_xy5r";
  let db = null;

  const $ = id => document.getElementById(id);

  async function boot() {
    db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    $("admin-login-btn").addEventListener("click", async () => {
      const email = $("admin-email").value.trim();
      const password = $("admin-password").value;
      if (!email || !password) return alert("Enter credentials.");
      
      const { error } = await db.auth.signInWithPassword({ email, password });
      if (error) return alert("Login failed: " + error.message);
      checkSession();
    });

    $("admin-logout-btn").addEventListener("click", async () => {
      await db.auth.signOut();
      $("admin-dashboard").style.display = "none";
      $("auth-screen").style.display = "flex";
    });

    checkSession();
  }

  async function checkSession() {
    const { data: { session } } = await db.auth.getSession();
    if (session) {
      $("auth-screen").style.display = "none";
      $("admin-dashboard").style.display = "block";
      loadVendorsList();
    }
  }

  window.loadVendorsList = async function() {
    const container = $("vendors-admin-list");
    container.replaceChildren();

    const { data: vendors, error } = await db
      .from("vendors")
      .select("*")
      .order("created_at", { ascending: false });

    if (error) {
      container.innerHTML = `<div class="empty-box">Error loading vendors: ${error.message}</div>`;
      return;
    }

    if (!vendors || vendors.length === 0) {
      container.innerHTML = `<div class="empty-box">No vendors registered yet.</div>`;
      return;
    }

    vendors.forEach(v => {
      const card = document.createElement("div");
      card.className = "vendor-card";

      const status = v.subscription_status || "PENDING_APPROVAL";
      const expires = v.subscription_expires_at ? new Date(v.subscription_expires_at).toLocaleDateString() : "Not Activated";
      const ref = v.pending_payment_ref || "N/A";
      const popLink = v.pop_receipt_url ? `<a href="${v.pop_receipt_url}" target="_blank" style="color:var(--accent); font-weight:700; text-decoration:none;"><i class="ph ph-file-arrow-down"></i> View Proof of Payment</a>` : `<span style="color:var(--muted);">No POP uploaded yet</span>`;

      card.innerHTML = `
        <div class="vendor-top">
          <div>
            <div class="vendor-title">${v.name} (${v.category || 'STORE'})</div>
            <div class="vendor-meta">Owner ID: ${v.owner_id}</div>
            <div class="vendor-meta">Payment Ref: <code style="background:#f1f5f9; padding:2px 6px; border-radius:4px; font-weight:700;">${ref}</code></div>
            <div class="vendor-meta">Subscription Expires: <strong>${expires}</strong></div>
          </div>
          <div>
            <span class="status-badge status-${status === 'ACTIVE' ? 'active' : 'pending'}">${status}</span>
          </div>
        </div>

        <div style="background:#f8fafc; padding:10px; border-radius:8px; display:flex; justify-content:space-between; align-items:center; font-size:12px;">
          <div>${popLink}</div>
          <button class="btn-primary" onclick="approveVendor('${v.id}')" style="width:auto; padding:8px 14px; background:var(--success);">
            ✓ Approve Store (1 Month Active)
          </button>
        </div>
      `;
      container.appendChild(card);
    });
  };

  window.approveVendor = async function(vendorId) {
    // Set status to ACTIVE and grant exactly 1 month from today
    const expiryDate = new Date();
    expiryDate.setMonth(expiryDate.getMonth() + 1);

    const { error } = await db
      .from("vendors")
      .update({
        subscription_status: "ACTIVE",
        subscription_expires_at: expiryDate.toISOString()
      })
      .eq("id", vendorId);

    if (error) {
      alert("Error approving vendor: " + error.message);
    } else {
      alert("Vendor approved successfully! Store is now unlocked and live.");
      loadVendorsList();
    }
  };

  document.addEventListener("DOMContentLoaded", boot);
})();
</script>
</body>
</html>
