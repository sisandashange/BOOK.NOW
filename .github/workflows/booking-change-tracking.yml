name: Booking change tracking regression tests

on:
  pull_request:
    branches: [main]
    paths:
      - "vendor.html"
      - "supabase/migrations/*booking_change_tracking*"
      - "supabase/tests/booking_change_tracking_ci.sql"
      - ".github/workflows/booking-change-tracking.yml"

permissions:
  contents: read

jobs:
  booking-change-tracking:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: booknow_change_tracking_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d booknow_change_tracking_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Check vendor JavaScript and incremental polling safeguards
        run: |
          python3 - <<'PY'
          import pathlib, re, subprocess, tempfile
          source = pathlib.Path("vendor.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script\\b[^>]*>(.*?)</script\\s*>", source, flags=re.I | re.S)
          if not scripts:
              raise SystemExit("No vendor inline script found.")
          for index, script in enumerate(scripts):
              if not script.strip():
                  continue
              path = pathlib.Path(tempfile.gettempdir()) / f"vendor-{index}.js"
              path.write_text(script, encoding="utf-8")
              subprocess.run(["node", "--check", str(path)], check=True)
          required = [
              '.gt("updated_at", bookingChangeCursor)',
              '.range(offset, offset + 499)',
              'setInterval(check, 15000)',
              'bookingLoadBusy = false'
          ]
          missing = [item for item in required if item not in source]
          if missing:
              raise SystemExit("Incremental polling regression: missing " + ", ".join(missing))
          print("Vendor syntax and incremental polling checks passed.")
          PY
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Run booking change tracking regression test
        env:
          PGPASSWORD: postgres
        run: |
          psql "postgresql://postgres@localhost:5432/booknow_change_tracking_ci" \
            --set ON_ERROR_STOP=1 \
            --file supabase/tests/booking_change_tracking_ci.sql
