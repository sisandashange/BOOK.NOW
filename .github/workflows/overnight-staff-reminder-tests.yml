name: Overnight staff and reminder regression tests

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/20261120080029_fix_overnight_staff_availability_and_reminders.sql"
      - "supabase/tests/overnight_staff_and_reminders_ci.sql"
      - ".github/workflows/overnight-staff-reminder-tests.yml"

permissions:
  contents: read

jobs:
  postgres-regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: booknow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d booknow_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out PR
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Run isolated overnight staff and reminder regression tests
        env:
          PGPASSWORD: postgres
        run: |
          psql "postgresql://postgres@localhost:5432/booknow_ci" \
            --set ON_ERROR_STOP=1 \
            --file supabase/tests/overnight_staff_and_reminders_ci.sql
