name: BOOK.NOW application checks

on:
  pull_request:
    branches: [main]
    paths:
      - "*.html"
      - "*.js"
      - "sw.js"
      - "tests/**"
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - ".github/workflows/app-quality.yml"
  push:
    branches: [main]
    paths:
      - "*.html"
      - "*.js"
      - "sw.js"
      - "tests/**"
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - ".github/workflows/app-quality.yml"

permissions:
  contents: read

jobs:
  application-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run application regression and utility tests
        run: node tests/js-smoke.test.cjs
      - name: Run optional customer account regression tests
        run: node tests/customer-account.test.cjs
      - name: Parse changed Edge Function TypeScript
        run: |
          npx --yes esbuild@0.25.0 supabase/functions/receipt-download/index.ts --bundle --format=esm --external:jsr:* --external:npm:* --outfile=/tmp/receipt-download.js
          npx --yes esbuild@0.25.0 supabase/functions/invite-staff/index.ts --bundle --format=esm --external:jsr:* --external:npm:* --outfile=/tmp/invite-staff.js
