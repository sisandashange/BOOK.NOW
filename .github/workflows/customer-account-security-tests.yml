name: Optional customer account security regression tests

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/20261124003016_optional_customer_accounts.sql"
      - "supabase/migrations/20261124100000_customer_booking_receipts.sql"
      - "supabase/tests/customer_account_security_ci.sql"
      - ".github/workflows/customer-account-security-tests.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/20261124003016_optional_customer_accounts.sql"
      - "supabase/migrations/20261124100000_customer_booking_receipts.sql"
      - "supabase/tests/customer_account_security_ci.sql"
      - ".github/workflows/customer-account-security-tests.yml"

permissions:
  contents: read

jobs:
  customer-account-security:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: booknow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d booknow_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Test customer account migration, RLS and ownership
        env:
          PGPASSWORD: postgres
        run: |
          psql "postgresql://postgres@localhost:5432/booknow_ci" \
            --set ON_ERROR_STOP=1 \
            --file supabase/tests/customer_account_security_ci.sql
