<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>Store Front — BOOK.NOW</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📅</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

  <style>
    :root { --primary:#0f172a; --accent:#2563eb; --accent-hover:#1d4ed8; --bg:#f8fafc; --surface:#fff; --text:#0f172a; --muted:#64748b; --border:#e2e8f0; --success:#16a34a; --warning:#d97706; --danger:#dc2626; --radius:16px; --shadow-sm:0 2px 8px rgba(15,23,42,.04); }
    * { box-sizing:border-box; font-family:'Plus Jakarta Sans',sans-serif; -webkit-tap-highlight-color:transparent; }
    body { margin:0; background:var(--bg); color:var(--text); padding-bottom:80px; }
    a:focus-visible, button:focus-visible, input:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }

    .top-nav { background:rgba(255,255,255,.95); backdrop-filter:blur(12px); padding:12px 16px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:30; }
    .back-btn { display:inline-flex; align-items:center; gap:5px; text-decoration:none; color:var(--primary); font-size:12px; font-weight:700; background:#f1f5f9; padding:6px 12px; border-radius:8px; }
    .back-btn:hover { background:#e2e8f0; }
    .brand { font-size:16px; font-weight:800; display:flex; align-items:center; gap:6px; color:var(--primary); letter-spacing:-.5px; }
    .container { padding:14px 12px; max-width:850px; margin:0 auto; }

    .store-hero { background:var(--surface); border-radius:var(--radius); border:1px solid var(--border); overflow:hidden; box-shadow:var(--shadow-sm); margin-bottom:18px; }
    .hero-banner { width:100%; height:180px; object-fit:cover; background:#e2e8f0; display:block; }
    .hero-content { padding:16px; }
    .store-title-row { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
    .store-title { font-size:20px; font-weight:800; margin:0; color:var(--primary); letter-spacing:-.4px; }
    .store-badge { font-size:9px; font-weight:800; background:#f1f5f9; color:var(--muted); padding:3px 8px; border-radius:5px; text-transform:uppercase; }
    .store-meta-list { display:flex; flex-wrap:wrap; gap:10px; margin-top:8px; font-size:12px; color:var(--muted); }
    .meta-item { display:inline-flex; align-items:center; gap:4px; font-weight:600; }
    .closed-banner { background:#fffbeb; border-top:1px solid #fde68a; color:#92400e; font-size:12px; font-weight:700; padding:10px 16px; display:flex; align-items:center; gap:6px; }
    .section-title { font-size:16px; font-weight:800; margin:0 0 12px; color:var(--primary); display:flex; align-items:center; gap:6px; }

    .menu-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    .menu-card { background:var(--surface); border-radius:var(--radius); border:1px solid var(--border); overflow:hidden; box-shadow:var(--shadow-sm); display:flex; flex-direction:column; min-width:0; position:relative; }
    .menu-img-wrapper { position:relative; width:100%; aspect-ratio:4/3; background:#f1f5f9; cursor:pointer; overflow:hidden; }
    .menu-cover-img { width:100%; height:100%; object-fit:cover; transition:transform .3s; }
    .menu-card:hover .menu-cover-img { transform:scale(1.04); }
    .zoom-overlay { position:absolute; top:6px; right:6px; background:rgba(15,23,42,.65); color:#fff; border-radius:50%; width:24px; height:24px; display:flex; align-items:center; justify-content:center; font-size:12px; }
    .sale-tag { position:absolute; top:6px; left:6px; background:var(--danger); color:#fff; font-size:9px; font-weight:800; padding:3px 6px; border-radius:5px; text-transform:uppercase; z-index:2; }
    .thumb-strip { display:flex; gap:4px; padding:6px 8px; background:#f8fafc; border-bottom:1px solid var(--border); overflow-x:auto; scrollbar-width:none; }
    .thumb-btn { width:30px; height:30px; border-radius:6px; object-fit:cover; border:2px solid transparent; cursor:pointer; opacity:.7; flex-shrink:0; }
    .thumb-btn.active, .thumb-btn:hover { border-color:var(--accent); opacity:1; }
    .menu-body { padding:10px; display:flex; flex-direction:column; flex-grow:1; justify-content:space-between; gap:8px; min-width:0; }
    .menu-title { font-size:13px; font-weight:800; color:var(--primary); margin:0; line-height:1.25; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
    .menu-footer { display:flex; justify-content:space-between; align-items:center; padding-top:6px; border-top:1px solid #f1f5f9; gap:4px; }
    .price-container { display:flex; flex-direction:column; }
    .menu-price { font-size:13px; font-weight:800; color:var(--danger); white-space:nowrap; line-height:1.2; }
    .menu-price.normal { color:var(--primary); }
    .original-price { font-size:10px; font-weight:700; color:var(--muted); text-decoration:line-through; line-height:1.1; }
    .btn-book { background:var(--accent); color:#fff; border:none; padding:6px 12px; border-radius:8px; font-size:11px; font-weight:700; cursor:pointer; white-space:nowrap; }
    .btn-book:hover { background:var(--accent-hover); }
    .btn-book:disabled { background:#cbd5e1; cursor:not-allowed; }

    .lightbox-modal { position:fixed; inset:0; background:rgba(15,23,42,.92); backdrop-filter:blur(10px); display:none; justify-content:center; align-items:center; z-index:200; padding:16px; }
    .lightbox-img { max-width:92vw; max-height:82vh; border-radius:14px; object-fit:contain; }
    .lightbox-close { position:absolute; top:16px; right:16px; color:#fff; font-size:28px; cursor:pointer; background:rgba(255,255,255,.2); border:0; border-radius:50%; width:40px; height:40px; display:flex; align-items:center; justify-content:center; }

    .modal { position:fixed; inset:0; background:rgba(15,23,42,.6); backdrop-filter:blur(6px); display:none; justify-content:center; align-items:flex-end; z-index:100; }
    .modal-sheet { background:#fff; width:100%; max-width:600px; padding:20px; border-radius:20px 20px 0 0; box-shadow:0 -10px 30px rgba(0,0,0,.15); max-height:90vh; overflow-y:auto; }
    .form-field { margin-bottom:12px; }
    .form-field label { display:block; font-size:11px; font-weight:700; color:var(--muted); margin-bottom:5px; text-transform:uppercase; }
    .form-field input { width:100%; padding:11px; border-radius:10px; border:1px solid var(--border); font-size:14px; }
    .form-field select { width:100%; padding:11px; border-radius:10px; border:1px solid var(--border); font-size:14px; background:#fff; }
    .pay-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:4px; }
    .pay-btn { padding:10px; border-radius:8px; border:1px solid var(--border); background:#fff; color:var(--text); font-weight:700; font-size:12px; cursor:pointer; }
    .pay-btn.on { border:2px solid var(--accent); background:#eff6ff; color:var(--accent); }
    .info-box { background:#f8fafc; padding:12px; border-radius:10px; border:1px solid var(--border); margin-bottom:12px; font-size:12px; text-align:left; }
    .info-box p { margin:0; color:var(--muted); line-height:1.4; font-size:11px; }
    .modal-error { color:var(--danger); font-size:12px; font-weight:700; margin:0 0 8px; min-height:16px; }
    .empty-box { text-align:center; padding:36px 12px; background:var(--surface); border-radius:14px; border:1px dashed var(--border); color:var(--muted); font-size:13px; grid-column:1/-1; }
  </style>
</head>
<body>

  <div class="top-nav">
    <a href="index.html" class="back-btn"><i class="ph ph-arrow-left"></i> All Spots</a>
    <div class="brand"><i class="ph ph-calendar-check" style="font-size:20px;color:var(--accent);"></i> BOOK.NOW</div>
  </div>

  <main class="container">
    <div id="store-hero-box" class="store-hero"><div class="empty-box">Loading store info...</div></div>

    <div id="services-section-container">
      <div class="section-title"><i class="ph ph-squares-four" style="color:var(--accent);"></i> Services & Menu</div>
      <div id="services-menu-box" class="menu-grid"><div class="empty-box">Loading menu items...</div></div>
    </div>
  </main>

  <div id="lightbox-modal" class="lightbox-modal" role="dialog" aria-modal="true" aria-label="Photo viewer">
    <button class="lightbox-close" id="close-lightbox" aria-label="Close photo"><i class="ph ph-x"></i></button>
    <img id="lightbox-img" class="lightbox-img" src="" alt="Full view">
  </div>

  <div id="booking-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-service-title">
    <div class="modal-sheet">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
        <div>
          <span style="font-size:10px;font-weight:700;color:var(--accent);text-transform:uppercase;">Book your appointment</span>
          <h3 id="modal-service-title" style="margin:2px 0 0;font-size:16px;font-weight:800;">Service</h3>
        </div>
        <button id="close-modal-btn" aria-label="Close booking form" style="background:none;border:0;cursor:pointer;"><i class="ph ph-x-circle" style="font-size:24px;color:var(--muted);"></i></button>
      </div>

      <div class="form-field">
        <label for="customer-name">Your Full Name</label>
        <input type="text" id="customer-name" placeholder="e.g. Sipho Dlamini" autocomplete="name">
      </div>
      <div class="form-field">
        <label for="customer-phone">Phone Number (WhatsApp)</label>
        <input type="tel" id="customer-phone" placeholder="e.g. 082 123 4567" autocomplete="tel">
      </div>
      <div class="form-field">
        <label for="booking-date">Appointment Date</label>
        <input type="date" id="booking-date" required>
      </div>
      <div class="form-field">
        <label for="booking-time">Appointment Time</label>
        <select id="booking-time" required><option value="">Choose a date first</option></select>
        <div id="slot-hint" style="font-size:11px;color:var(--muted);margin-top:5px;line-height:1.4;"></div>
      </div>

      <div class="form-field">
        <label>Payment Method</label>
        <div class="pay-grid">
          <button type="button" id="pay-method-eft" class="pay-btn on"><i class="ph ph-bank"></i> Instant EFT (Direct)</button>
          <button type="button" id="pay-method-cash" class="pay-btn"><i class="ph ph-money"></i> Pay Cash</button>
        </div>
      </div>

      <div id="eft-details-container" class="info-box">
        <div style="font-weight:700;color:var(--primary);margin-bottom:4px;"><i class="ph ph-shield-check" style="color:var(--success);font-size:16px;"></i> Pay by EFT</div>
        <p>After you confirm, you'll get a unique payment reference and this shop's bank details.</p>
      </div>

      <p id="modal-error" class="modal-error" role="alert"></p>
      <button class="btn-book" id="confirm-booking-btn" style="width:100%;padding:12px;font-size:13px;">Confirm Appointment</button>
    </div>
  </div>

  <script>
  (() => {
    "use strict";

    const SUPABASE_URL = "https://pvplhsiafklaoqrpdhpd.supabase.co";
    const SUPABASE_KEY = "sb_publishable_VKlDPkR9JvJr6E4bcz1HSg_OG5_xy5r";

    const STORE_COLUMNS = "id, store_name, category, store_image_url, phone_number, address, status, subscription_expires_at, opening_time, closing_time, manual_status, holiday_start_date, holiday_end_date, bank_name, account_holder, account_name, account_number, branch_code";

    let db = null;
    let selectedService = null;
    let storeData = null;
    let bookingOpen = false;
    let payMethod = "EFT";

    const FALLBACK_IMAGES = {
      BARBER: "https://images.unsplash.com/photo-1503951914875-452162b0f3f1?auto=format&fit=crop&w=600&q=70",
      SALON: "https://images.unsplash.com/photo-1560066984-138dadb4c035?auto=format&fit=crop&w=600&q=70",
      SHISANYAMA: "https://images.unsplash.com/photo-1555939594-58d7cb561ad1?auto=format&fit=crop&w=600&q=70",
      DEFAULT: "https://images.unsplash.com/photo-1521590832167-7bcbfaa6381f?auto=format&fit=crop&w=600&q=70"
    };

    const $ = id => document.getElementById(id);
    const money = v => "R" + Number(v || 0).toFixed(2);
    const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[c]));

    function normalizeCategory(raw) {
      const c = (raw || "").toLowerCase();
      if (c.includes("barber")) return "BARBER";
      if (c.includes("salon") || c.includes("beauty")) return "SALON";
      if (c.includes("shisanyama") || c.includes("braai")) return "SHISANYAMA";
      return "DEFAULT";
    }

    function generatePaymentRef() {
      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      const bytes = crypto.getRandomValues(new Uint8Array(6));
      return "BN-" + Array.from(bytes, b => chars[b % chars.length]).join("");
    }

    function saNow() {
      const parts = new Intl.DateTimeFormat("en-GB", {
        timeZone: "Africa/Johannesburg", year: "numeric", month: "2-digit", day: "2-digit",
        hour: "2-digit", minute: "2-digit", hourCycle: "h23"
      }).formatToParts(new Date());
      return Object.fromEntries(parts.filter(p => p.type !== "literal").map(p => [p.type, p.value]));
    }

    // South African numbers: 0821234567 -> 27821234567. Returns "" if it doesn't look valid.
    function waNumber(raw) {
      let d = String(raw || "").replace(/\D/g, "");
      if (d.startsWith("0")) d = "27" + d.slice(1);
      return d.length >= 11 && d.length <= 15 ? d : "";
    }

    // hard = store can't be shown at all; otherwise it's just closed right now
    function getAvailability(store) {
      const expiry = store.subscription_expires_at ? Date.parse(store.subscription_expires_at) : NaN;
      if (String(store.status || "").toLowerCase() !== "active" || !Number.isFinite(expiry) || expiry <= Date.now()) {
        return { open: false, hard: true, message: "This shop isn't taking bookings on BOOK.NOW right now." };
      }
      if (String(store.manual_status || "OPEN").toUpperCase() === "CLOSED") {
        return { open: false, hard: false, message: "Temporarily closed. New bookings are paused." };
      }

      return { open: true, hard: false, message: "Open for bookings." };
    }

    function toMin(hhmm) { const [h, m] = hhmm.split(":").map(Number); return h * 60 + m; }
    function fmtMin(m) { m = ((m % 1440) + 1440) % 1440; return String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0"); }
    function saTodayStr() { const n = saNow(); return `${n.year}-${n.month}-${n.day}`; }
    function addDays(dateStr, days) { const d = new Date(dateStr + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + days); return d.toISOString().slice(0, 10); }
    function fmtAppt(dateStr, timeStr) {
      const d = new Date(dateStr + "T12:00:00Z").toLocaleDateString("en-ZA", { weekday: "short", day: "numeric", month: "short", year: "numeric", timeZone: "UTC" });
      return d + " at " + timeStr;
    }

    function dateClosedReason(store, d) {
      const hs = store.holiday_start_date ? String(store.holiday_start_date).slice(0, 10) : "";
      const he = store.holiday_end_date ? String(store.holiday_end_date).slice(0, 10) : "";
      if ((hs && he && d >= hs && d <= he) || (hs && !he && d >= hs) || (!hs && he && d === he)) {
        return "The shop is closed on this date. Try another day.";
      }
      return "";
    }

    // Builds the 30-minute time slots for the chosen date and greys out booked ones
    async function refreshSlots() {
      const sel = $("booking-time"), hint = $("slot-hint"), date = $("booking-date").value;
      const mk = (v, t, dis) => { const o = document.createElement("option"); o.value = v; o.textContent = t; o.disabled = !!dis; return o; };
      hint.textContent = "";
      if (!date || !storeData) { sel.replaceChildren(mk("", "Choose a date first")); return; }
      sel.replaceChildren(mk("", "Loading times..."));

      const closed = dateClosedReason(storeData, date);
      if (closed) { sel.replaceChildren(mk("", "No times available")); hint.textContent = closed; return; }

      const open = toMin(String(storeData.opening_time || "08:00").slice(0, 5));
      let close = toMin(String(storeData.closing_time || "17:00").slice(0, 5));
      if (open === close) { sel.replaceChildren(mk("", "No times available")); hint.textContent = "This shop's opening hours aren't set up yet."; return; }
      if (close < open) close += 1440;

      let taken = new Set();
      try {
        const { data } = await db.rpc("get_taken_slots", { p_store_id: storeData.id, p_date: date });
        taken = new Set((data || []).map(r => r.booking_time));
      } catch (e) { console.warn("Could not load taken times:", e); }

      const now = saNow();
      const nowMin = date === saTodayStr() ? Number(now.hour) * 60 + Number(now.minute) : -1;

      const options = [];
      let free = 0;
      for (let m = open; m < close; m += 30) {
        if (nowMin >= 0 && (m % 1440) <= nowMin) continue;
        const label = fmtMin(m);
        const isTaken = taken.has(label);
        if (!isTaken) free++;
        options.push(mk(label, isTaken ? label + " (booked)" : label, isTaken));
      }

      if (!free) { sel.replaceChildren(mk("", "No times available")); hint.textContent = "No free times on this date. Try another day."; return; }
      sel.replaceChildren(mk("", "Choose a time"), ...options);
    }

    function setPaymentMethod(method) {
      payMethod = method;
      $("pay-method-eft").classList.toggle("on", method === "EFT");
      $("pay-method-cash").classList.toggle("on", method === "CASH");
      $("eft-details-container").style.display = method === "EFT" ? "block" : "none";
    }

    function showStoreMessage(html) {
      $("store-hero-box").innerHTML = html;
      $("services-section-container").style.display = "none";
    }

    async function loadStorePage() {
      const storeId = new URLSearchParams(location.search).get("id");
      if (!storeId) {
        showStoreMessage('<div class="empty-box">No shop selected. <a href="index.html">Browse all shops</a></div>');
        return;
      }

      try {
        const { data: store, error: storeErr } = await db.from("stores").select(STORE_COLUMNS).eq("id", storeId).maybeSingle();
        if (storeErr) throw storeErr;
        if (!store) {
          showStoreMessage('<div class="empty-box">We couldn\'t find this shop. <a href="index.html">Browse all shops</a></div>');
          return;
        }
        storeData = store;

        const availability = getAvailability(store);
        if (availability.hard) {
          showStoreMessage(`
            <div class="empty-box" style="padding:40px 16px">
              <div style="font-size:42px;margin-bottom:12px;color:var(--warning);"><i class="ph ph-clock"></i></div>
              <h2 style="font-size:20px;color:var(--primary);margin-top:0;">Shop unavailable</h2>
              <p style="line-height:1.7;color:var(--muted);">${esc(availability.message)}</p>
              <a href="index.html" class="btn-book" style="display:inline-block;text-decoration:none;padding:11px 18px;margin-top:8px;">Browse all shops</a>
            </div>`);
          return;
        }
        bookingOpen = availability.open;

        const cat = normalizeCategory(store.category);
        const cover = store.store_image_url || FALLBACK_IMAGES[cat];
        const name = store.store_name || "Shop";
        $("store-hero-box").innerHTML = `
          <img src="${esc(cover)}" class="hero-banner" alt="${esc(name)}">
          <div class="hero-content">
            <div class="store-title-row">
              <h1 class="store-title">${esc(name)}</h1>
              <span class="store-badge">${esc(store.category || "Local spot")}</span>
            </div>
            <div class="store-meta-list">
              ${store.address ? `<span class="meta-item"><i class="ph ph-map-pin"></i> ${esc(store.address)}</span>` : ""}
              <span class="meta-item"><i class="ph ph-clock"></i> ${esc(String(store.opening_time || "08:00").slice(0, 5))} to ${esc(String(store.closing_time || "17:00").slice(0, 5))}</span>
            </div>
          </div>
          ${bookingOpen ? "" : `<div class="closed-banner"><i class="ph ph-clock"></i> ${esc(availability.message)}</div>`}`;
        document.title = name + " — BOOK.NOW";

        const { data: services, error: serviceErr } = await db
          .from("service_items")
          .select("id, title, price, sale_price, sale_start_date, sale_end_date, image_urls")
          .eq("store_id", storeId)
          .order("created_at", { ascending: false });
        if (serviceErr) throw serviceErr;

        const menuBox = $("services-menu-box");
        if (!services || services.length === 0) {
          menuBox.innerHTML = '<div class="empty-box">This shop hasn\'t added any services yet.</div>';
          return;
        }

        const t = saNow();
        const todayStr = `${t.year}-${t.month}-${t.day}`;

        const cards = services.map(s => {
          const photos = Array.isArray(s.image_urls) ? s.image_urls.filter(u => u && typeof u === "string") : [];
          const defaultImg = photos[0] || FALLBACK_IMAGES[cat];

          const validSale = s.sale_price != null && Number(s.sale_price) > 0 && Number(s.sale_price) < Number(s.price);
          const onSale = validSale && (!s.sale_start_date || s.sale_start_date <= todayStr) && (!s.sale_end_date || s.sale_end_date >= todayStr);
          const activePrice = onSale ? Number(s.sale_price) : Number(s.price);

          const card = document.createElement("div");
          card.className = "menu-card";

          if (onSale) {
            const tag = document.createElement("div");
            tag.className = "sale-tag";
            tag.textContent = "On sale";
            card.appendChild(tag);
          }

          const wrap = document.createElement("div");
          wrap.className = "menu-img-wrapper";
          const cover = document.createElement("img");
          cover.className = "menu-cover-img";
          cover.loading = "lazy";
          cover.src = defaultImg;
          cover.alt = s.title;
          const zoom = document.createElement("div");
          zoom.className = "zoom-overlay";
          zoom.innerHTML = '<i class="ph ph-arrows-out-simple"></i>';
          wrap.append(cover, zoom);
          wrap.addEventListener("click", () => openLightbox(cover.src));
          card.appendChild(wrap);

          if (photos.length > 1) {
            const strip = document.createElement("div");
            strip.className = "thumb-strip";
            photos.forEach((url, i) => {
              const thumb = document.createElement("img");
              thumb.className = "thumb-btn" + (i === 0 ? " active" : "");
              thumb.src = url;
              thumb.alt = "Photo " + (i + 1) + " of " + s.title;
              thumb.addEventListener("click", () => {
                cover.src = url;
                strip.querySelectorAll(".thumb-btn").forEach(b => b.classList.remove("active"));
                thumb.classList.add("active");
              });
              strip.appendChild(thumb);
            });
            card.appendChild(strip);
          }

          const title = document.createElement("h3");
          title.className = "menu-title";
          title.textContent = s.title;

          const priceBox = document.createElement("div");
          priceBox.className = "price-container";
          if (onSale) {
            const was = document.createElement("span");
            was.className = "original-price";
            was.textContent = money(s.price);
            const now = document.createElement("span");
            now.className = "menu-price";
            now.textContent = money(activePrice);
            priceBox.append(was, now);
          } else {
            const p = document.createElement("span");
            p.className = "menu-price normal";
            p.textContent = money(activePrice);
            priceBox.appendChild(p);
          }

          const btn = document.createElement("button");
          btn.className = "btn-book";
          btn.textContent = bookingOpen ? "Book" : "Closed";
          btn.disabled = !bookingOpen;
          btn.addEventListener("click", () => openBookingModal(s.id, s.title, activePrice));

          const footer = document.createElement("div");
          footer.className = "menu-footer";
          footer.append(priceBox, btn);

          const body = document.createElement("div");
          body.className = "menu-body";
          body.append(title, footer);
          card.appendChild(body);
          return card;
        });

        menuBox.replaceChildren(...cards);
      } catch (err) {
        console.error("Store load error:", err);
        showStoreMessage('<div class="empty-box">We couldn\'t load this shop. Refresh the page to try again.</div>');
      }
    }

    function openLightbox(src) {
      $("lightbox-img").src = src;
      $("lightbox-modal").style.display = "flex";
    }

    function openBookingModal(serviceId, title, price) {
      selectedService = { storeId: storeData.id, serviceId, title, price };
      $("modal-service-title").textContent = `${title} (${money(price)})`;
      $("modal-error").textContent = "";
      const today = saTodayStr();
      $("booking-date").min = today;
      $("booking-date").max = addDays(today, 60);
      $("booking-date").value = "";
      refreshSlots();
      $("booking-modal").style.display = "flex";
      $("customer-name").focus();
    }

    function closeModals() {
      $("booking-modal").style.display = "none";
      $("lightbox-modal").style.display = "none";
    }

    async function confirmBooking() {
      const name = $("customer-name").value.trim();
      const phone = $("customer-phone").value.trim();
      const date = $("booking-date").value;
      const time = $("booking-time").value;
      const button = $("confirm-booking-btn");
      const errorBox = $("modal-error");
      errorBox.textContent = "";

      if (name.length < 2) { errorBox.textContent = "Enter your full name."; return; }
      if (phone.replace(/\D/g, "").length < 9) { errorBox.textContent = "Enter a valid phone number."; return; }
      if (!date) { errorBox.textContent = "Choose your appointment date."; return; }
      if (date < saTodayStr()) { errorBox.textContent = "Choose today or a future date."; return; }
      if (!time) { errorBox.textContent = "Choose your appointment time."; return; }
      if (!selectedService) return;

      button.disabled = true;
      button.textContent = "Submitting booking...";

      try {
        // Re-check the shop is still open before booking
        const { data: current, error: currentErr } = await db.from("stores").select(STORE_COLUMNS).eq("id", selectedService.storeId).maybeSingle();
        if (currentErr) throw currentErr;
        const availability = current ? getAvailability(current) : { open: false, message: "This shop is no longer available." };
        if (!availability.open) {
          errorBox.textContent = availability.message;
          button.disabled = false;
          button.textContent = "Confirm Appointment";
          return;
        }

        const bookingId = crypto.randomUUID();
        const paymentRef = generatePaymentRef();

        // Insert only. Status, payment status, price and queue number are set by the database, which also checks the date and time.
        const { error } = await db.from("bookings").insert([{
          id: bookingId,
          store_id: selectedService.storeId,
          service_id: selectedService.serviceId,
          customer_name: name,
          customer_phone: phone,
          booking_date: date,
          booking_time: time,
          payment_method: payMethod,
          payment_ref: paymentRef
        }]);
        if (error) throw error;

        // Read back queue number and price (needs the get_booking_receipt function)
        let receipt = null;
        try {
          const { data } = await db.rpc("get_booking_receipt", { p_id: bookingId });
          receipt = Array.isArray(data) ? data[0] : data;
        } catch (e) { console.warn("Receipt lookup unavailable:", e); }

        const queueNumber = receipt && receipt.queue_number ? receipt.queue_number : null;
        const price = receipt && receipt.booked_price != null ? receipt.booked_price : selectedService.price;
        const when = new Date(receipt && receipt.created_at ? receipt.created_at : Date.now()).toLocaleString("en-ZA", {
          timeZone: "Africa/Johannesburg", dateStyle: "medium", timeStyle: "short"
        });

        const apptText = fmtAppt((receipt && receipt.booking_date) || date, (receipt && receipt.booking_time) || time);
        const shopName = storeData.store_name || "the shop";
        const bankName = storeData.bank_name || "Ask the shop on WhatsApp";
        const accHolder = storeData.account_holder || storeData.account_name || shopName;
        const accNumber = storeData.account_number || "Ask the shop on WhatsApp";
        const branchCode = storeData.branch_code || "N/A";
        const payNote = payMethod === "EFT" ? `Instant EFT (Ref: ${paymentRef})` : `Cash at the shop (Ref: ${paymentRef})`;

        const waPhone = waNumber(storeData.phone_number);
        const message = encodeURIComponent(
          `Hi ${shopName}! I just booked "${selectedService.title}" (${money(price)}) on BOOK.NOW.\n\n` +
          `Name: ${name}\nPhone: ${phone}\nAppointment: ${apptText} (South African time)\n` +
          `Payment ref: ${paymentRef}\nPayment: ${payNote}\n` +
          (queueNumber ? `Booking number for that day: #${queueNumber}\n` : "") +
          `\nPlease confirm my appointment.`
        );
        const waUrl = waPhone ? `https://wa.me/${waPhone}?text=${message}` : "";
        const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(bookingId)}`;

        $("booking-modal").querySelector(".modal-sheet").innerHTML = `
          <div style="text-align:center;padding:10px 0;">
            <div style="background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;padding:8px 12px;border-radius:8px;font-size:11px;font-weight:800;margin-bottom:10px;">
              APPOINTMENT: ${esc(apptText.toUpperCase())}
            </div>

            <div class="info-box">
              <div style="margin-bottom:3px;"><strong>Service:</strong> ${esc(selectedService.title)} (${esc(money(price))})</div>
              <div style="margin-bottom:3px;"><strong>Appointment:</strong> ${esc(apptText)} (SAST)</div>
              <div style="margin-bottom:3px;"><strong>Name:</strong> ${esc(name)}</div>
              <div><strong>Phone:</strong> ${esc(phone)}</div>
            </div>

            ${payMethod === "EFT" ? `
            <div class="info-box">
              <div style="font-weight:800;color:var(--primary);margin-bottom:6px;"><i class="ph ph-bank"></i> Bank details for ${esc(shopName)}</div>
              <div style="margin-bottom:3px;"><strong>Bank:</strong> ${esc(bankName)}</div>
              <div style="margin-bottom:3px;"><strong>Account name:</strong> ${esc(accHolder)}</div>
              <div style="margin-bottom:3px;"><strong>Account number:</strong> ${esc(accNumber)}</div>
              <div style="margin-bottom:6px;"><strong>Branch code:</strong> ${esc(branchCode)}</div>
              <div style="background:#fff;padding:8px;border-radius:6px;border:1px solid #cbd5e1;text-align:center;">
                <span style="font-size:10px;color:var(--muted);display:block;text-transform:uppercase;font-weight:700;">Use this payment reference</span>
                <span style="font-size:18px;font-weight:800;color:var(--accent);font-family:monospace;">${esc(paymentRef)}</span>
              </div>
            </div>` : `
            <div class="info-box"><p>Pay cash at the shop. Show this screen and your reference <strong>${esc(paymentRef)}</strong>.</p></div>`}

            <div style="background:#fff;border:2px dashed var(--border);padding:10px;border-radius:14px;margin-bottom:12px;display:inline-block;">
              <img src="${esc(qrUrl)}" alt="Booking QR code" width="130" height="130" style="border-radius:8px;">
              <div style="font-size:10px;font-weight:800;color:var(--danger);margin-top:4px;text-transform:uppercase;">Unpaid. Ref: ${esc(paymentRef)}</div>
            </div>

            ${waUrl ? `<a href="${esc(waUrl)}" target="_blank" rel="noopener" class="btn-book" style="display:block;width:100%;text-decoration:none;padding:12px;font-size:13px;background:#25d366;border-radius:10px;margin-bottom:8px;">
              <i class="ph ph-whatsapp-logo" style="font-size:16px;vertical-align:middle;"></i> Send booking to the shop on WhatsApp
            </a>` : `<p style="font-size:12px;color:var(--muted);">This shop hasn't added a WhatsApp number. Screenshot this screen and show it at the shop.</p>`}
            <button id="done-btn" style="background:none;border:none;color:var(--muted);font-size:12px;font-weight:700;cursor:pointer;">Done</button>
          </div>`;
        $("done-btn").addEventListener("click", () => location.reload());

      } catch (err) {
        console.error("Booking error:", err);
        errorBox.textContent = err && err.code === "23505"
          ? "That time was just taken. Please choose another time."
          : (err && err.code === "P0001" && err.message ? err.message : "We couldn't save your booking. Check your connection and try again.");
        refreshSlots();
        button.disabled = false;
        button.textContent = "Confirm Appointment";
      }
    }

    function init() {
      db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      $("close-modal-btn").addEventListener("click", closeModals);
      $("confirm-booking-btn").addEventListener("click", confirmBooking);
      $("close-lightbox").addEventListener("click", closeModals);
      $("lightbox-modal").addEventListener("click", e => { if (e.target === $("lightbox-modal")) closeModals(); });
      $("booking-date").addEventListener("change", refreshSlots);
      $("pay-method-eft").addEventListener("click", () => setPaymentMethod("EFT"));
      $("pay-method-cash").addEventListener("click", () => setPaymentMethod("CASH"));
      document.addEventListener("keydown", e => { if (e.key === "Escape") closeModals(); });

      loadStorePage();
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", init, { once: true });
    } else {
      init();
    }
  })();
  </script>
</body>
</html>
