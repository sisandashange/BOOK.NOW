<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Store Front — BOOK.NOW</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --primary: #0f172a;
      --accent: #2864e8;
      --accent-hover: #1d4ed8;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --success: #16a34a;
      --warning: #d97706;
      --danger: #c93636;
      --danger-bg: #fef2f2;
      --radius: 20px;
      --shadow-sm: 0 3px 12px rgba(15, 23, 42, 0.045);
    }

    * {
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0 0 80px;
      background: var(--bg);
      color: var(--text);
    }

    button, input { font: inherit; }

    .top-nav {
      background: rgba(255,255,255,.97);
      backdrop-filter: blur(12px);
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 30;
      min-height: 62px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      color: var(--primary);
      font-size: 13px;
      font-weight: 800;
      background: #f1f5f9;
      padding: 9px 12px;
      border-radius: 10px;
    }

    .brand {
      font-size: 18px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--primary);
      letter-spacing: -.6px;
    }

    .container {
      padding: 16px 12px;
      max-width: 1000px;
      margin: 0 auto;
    }

    .store-hero {
      background: var(--surface);
      border-radius: 24px;
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      margin-bottom: 28px;
    }

    .hero-banner {
      width: 100%;
      height: 260px;
      object-fit: cover;
      background: #e2e8f0;
      display: block;
    }

    .hero-content { padding: 22px 24px; }

    .store-title-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .store-title {
      font-size: 27px;
      font-weight: 800;
      margin: 0;
      letter-spacing: -.8px;
    }

    .store-badge {
      font-size: 12px;
      font-weight: 800;
      background: #f1f5f9;
      color: var(--muted);
      padding: 7px 11px;
      border-radius: 8px;
      text-transform: uppercase;
    }

    .store-meta-list {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 12px;
      font-size: 15px;
      color: var(--muted);
    }

    .meta-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
    }

    .rating-item { color: #bd7b17; font-weight: 800; }

    .section-title {
      font-size: 23px;
      font-weight: 800;
      margin: 0 0 18px;
      display: flex;
      align-items: center;
      gap: 9px;
      letter-spacing: -.5px;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      align-items: stretch;
    }

    .menu-card {
      background: var(--surface);
      border-radius: 25px;
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      min-width: 0;
      position: relative;
    }

    .menu-img-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / .72;
      background: #050505;
      cursor: pointer;
      overflow: hidden;
    }

    .menu-cover-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .25s;
    }

    .menu-card:hover .menu-cover-img { transform: scale(1.025); }

    .zoom-overlay {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(15,23,42,.78);
      color: white;
      border-radius: 50%;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .sale-tag {
      position: absolute;
      top: 10px;
      left: 10px;
      background: #dc2626;
      color: white;
      font-size: 12px;
      font-weight: 800;
      padding: 6px 10px;
      border-radius: 8px;
      text-transform: uppercase;
      z-index: 2;
      box-shadow: 0 3px 9px rgba(220,38,38,.25);
    }

    .thumb-strip {
      display: flex;
      gap: 7px;
      padding: 10px 12px;
      background: #f8fafc;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      scrollbar-width: none;
    }

    .thumb-strip::-webkit-scrollbar { display: none; }

    .thumb-btn {
      width: 46px;
      height: 46px;
      border-radius: 8px;
      object-fit: cover;
      border: 2px solid transparent;
      cursor: pointer;
      opacity: .78;
      flex-shrink: 0;
    }

    .thumb-btn.active, .thumb-btn:hover {
      border-color: var(--accent);
      opacity: 1;
    }

    .menu-body {
      padding: 16px 16px 15px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
      gap: 16px;
      min-width: 0;
    }

    .menu-title {
      font-size: 20px;
      font-weight: 800;
      margin: 0 0 12px;
      letter-spacing: -.55px;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    .menu-duration {
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .menu-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
      padding-top: 12px;
      border-top: 1px solid #f1f5f9;
      gap: 8px;
    }

    .price-container {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }

    .menu-price {
      font-size: 22px;
      font-weight: 800;
      color: var(--danger);
      white-space: nowrap;
      line-height: 1.2;
    }

    .menu-price.normal { color: var(--primary); }

    .original-price {
      font-size: 15px;
      font-weight: 600;
      color: #7b8794;
      text-decoration: line-through;
      line-height: 1.2;
    }

    .btn-book {
      background: var(--accent);
      color: white;
      border: none;
      padding: 11px 19px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      transition: background .2s;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .btn-book:hover { background: var(--accent-hover); }
    .btn-book:disabled { opacity: .65; cursor: wait; }

    .lightbox-modal {
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,.94);
      backdrop-filter: blur(10px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 200;
      padding: 16px;
    }

    .lightbox-img {
      max-width: 92vw;
      max-height: 82vh;
      border-radius: 14px;
      object-fit: contain;
    }

    .lightbox-close {
      position: absolute;
      top: 16px;
      right: 16px;
      color: white;
      font-size: 28px;
      cursor: pointer;
      background: rgba(255,255,255,.2);
      border-radius: 50%;
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,.6);
      backdrop-filter: blur(6px);
      display: none;
      justify-content: center;
      align-items: flex-end;
      z-index: 100;
    }

    .modal-sheet {
      background: #fff;
      width: 100%;
      max-width: 600px;
      padding: 22px;
      border-radius: 22px 22px 0 0;
      box-shadow: 0 -10px 30px rgba(0,0,0,.15);
      max-height: 90vh;
      overflow-y: auto;
    }

    .form-field { margin-bottom: 14px; }

    .form-field label {
      display: block;
      font-size: 12px;
      font-weight: 800;
      color: var(--muted);
      margin-bottom: 7px;
      text-transform: uppercase;
    }

    .form-field input {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: 15px;
      outline: none;
    }

    .empty-box {
      text-align: center;
      padding: 36px 12px;
      background: var(--surface);
      border-radius: 14px;
      border: 1px dashed var(--border);
      color: var(--muted);
      font-size: 13px;
      grid-column: 1 / -1;
    }

    @media (max-width: 480px) {
      .top-nav { padding: 12px 14px; }
      .brand { font-size: 17px; }
      .container { padding: 14px 12px; }
      .hero-banner { height: 230px; }
      .hero-content { padding: 18px 20px; }
      .store-title { font-size: 25px; }
      .store-meta-list { font-size: 14px; gap: 10px; }
      .section-title { font-size: 21px; margin-bottom: 16px; }
      .menu-grid { gap: 12px; }
      .menu-card { border-radius: 25px; }
      .menu-img-wrapper { aspect-ratio: 1 / .72; }
      .menu-body { padding: 15px 12px 13px; gap: 14px; }
      .menu-title { font-size: 17px; margin-bottom: 12px; }
      .menu-duration { font-size: 12px; }
      .menu-footer { gap: 5px; padding-top: 11px; }
      .menu-price { font-size: 19px; }
      .original-price { font-size: 13px; }
      .btn-book { padding: 10px 14px; font-size: 14px; border-radius: 11px; }
      .thumb-btn { width: 43px; height: 43px; }
    }

    @media (max-width: 350px) {
      .menu-grid { gap: 8px; }
      .menu-body { padding: 12px 9px; }
      .menu-title { font-size: 15px; }
      .menu-price { font-size: 16px; }
      .original-price { font-size: 11px; }
      .btn-book { padding: 9px 10px; font-size: 12px; }
    }

    @media (min-width: 700px) {
      .menu-grid { gap: 20px; }
      .menu-img-wrapper { aspect-ratio: 1 / .65; }
      .menu-body { padding: 20px; }
      .menu-title { font-size: 22px; }
      .menu-price { font-size: 24px; }
      .btn-book { padding: 12px 22px; }
    }
  </style>
</head>

<body>
  <div class="top-nav">
    <a href="index.html" class="back-btn"><i class="ph ph-arrow-left"></i> All Spots</a>
    <div class="brand">
      <i class="ph ph-calendar-check" style="font-size:22px;color:var(--accent)"></i>
      BOOK.NOW
    </div>
  </div>

  <main class="container">
    <div id="store-hero-box" class="store-hero">
      <div class="empty-box">Loading store info...</div>
    </div>

    <h2 class="section-title">
      <i class="ph ph-squares-four" style="color:var(--accent)"></i>
      Services &amp; Menu
    </h2>

    <div id="services-menu-box" class="menu-grid">
      <div class="empty-box">Loading menu items...</div>
    </div>
  </main>

  <div id="lightbox-modal" class="lightbox-modal">
    <button type="button" class="lightbox-close" id="close-lightbox" aria-label="Close image">
      <i class="ph ph-x"></i>
    </button>
    <img id="lightbox-img" class="lightbox-img" src="" alt="Full view">
  </div>

  <div id="booking-modal" class="modal">
    <div class="modal-sheet">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <div>
          <span style="font-size:11px;font-weight:800;color:var(--accent);text-transform:uppercase">Instant Appointment</span>
          <h3 id="modal-service-title" style="margin:3px 0 0;font-size:18px;font-weight:800">Service</h3>
        </div>
        <button type="button" id="close-modal-btn" aria-label="Close booking" style="border:0;background:none;font-size:25px;color:var(--muted);cursor:pointer">
          <i class="ph ph-x-circle"></i>
        </button>
      </div>

      <div class="form-field">
        <label for="customer-name">Your Full Name</label>
        <input type="text" id="customer-name" autocomplete="name" placeholder="e.g. Sipho Dlamini">
      </div>

      <div class="form-field">
        <label for="customer-phone">Phone Number (WhatsApp)</label>
        <input type="tel" id="customer-phone" autocomplete="tel" placeholder="e.g. 082 123 4567">
      </div>

      <div class="form-field">
        <label>Payment Method</label>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px">
          <button type="button" id="pay-method-eft" class="pay-method-btn" onclick="setPaymentMethod('EFT')" style="padding:11px 8px;border-radius:10px;border:2px solid var(--accent);background:#eff6ff;color:var(--accent);font-weight:800;font-size:12px;cursor:pointer">
            <i class="ph ph-bank"></i> Instant EFT (Direct)
          </button>
          <button type="button" id="pay-method-cash" class="pay-method-btn" onclick="setPaymentMethod('CASH')" style="padding:11px 8px;border-radius:10px;border:1px solid var(--border);background:white;color:var(--text);font-weight:800;font-size:12px;cursor:pointer">
            <i class="ph ph-money"></i> Pay Cash
          </button>
        </div>
      </div>

      <div id="eft-details-container" style="background:#f8fafc;padding:13px;border-radius:10px;border:1px solid var(--border);margin-bottom:14px;font-size:12px">
        <div style="font-weight:800;color:var(--primary);margin-bottom:5px">
          <i class="ph ph-shield-check" style="color:var(--success);font-size:16px"></i>
          Verified Vendor Banking
        </div>
        <p style="margin:0;color:var(--muted);line-height:1.5;font-size:12px">
          Your order generates a unique reference code. The shop's official bank details and payment reference will appear after booking.
        </p>
      </div>

      <button class="btn-book" id="confirm-booking-btn" style="width:100%;padding:14px;font-size:15px;margin-top:5px">Confirm Appointment</button>
    </div>
  </div>

  <script>
  (() => {
    "use strict";

    const SUPABASE_URL = "https://pvplhsiafklaoqrpdhpd.supabase.co";
    const SUPABASE_KEY = "sb_publishable_VKlDPkR9JvJrJ6E4bcz1HSg_OG5_xy5r";

    let supabase = null;
    let selectedService = null;
    let storeData = null;
    let selectedPaymentMethod = "EFT";

    const FALLBACK_IMAGES = {
      BARBER: "https://images.unsplash.com/photo-1503951914875-452162b0f3f1?auto=format&fit=crop&w=1000&q=85",
      SALON: "https://images.unsplash.com/photo-1560066984-138dadb4c035?auto=format&fit=crop&w=1000&q=85",
      SHISANYAMA: "https://images.unsplash.com/photo-1555939594-58d7cb561ad1?auto=format&fit=crop&w=1000&q=85",
      DEFAULT: "https://images.unsplash.com/photo-1521590832167-7bcbfaa6381f?auto=format&fit=crop&w=1000&q=85"
    };

    const $ = id => document.getElementById(id);

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[char]);
    }

    function generatePaymentRef() {
      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      let ref = "BN-";
      for (let i = 0; i < 6; i++) {
        ref += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return ref;
    }

    window.setPaymentMethod = function(method) {
      selectedPaymentMethod = method === "CASH" ? "CASH" : "EFT";

      const eftBtn = $("pay-method-eft");
      const cashBtn = $("pay-method-cash");
      const eftNotice = $("eft-details-container");

      const selectedStyle = {
        border: "2px solid var(--accent)",
        background: "#eff6ff",
        color: "var(--accent)"
      };
      const normalStyle = {
        border: "1px solid var(--border)",
        background: "white",
        color: "var(--text)"
      };

      Object.assign(eftBtn.style, selectedPaymentMethod === "EFT" ? selectedStyle : normalStyle);
      Object.assign(cashBtn.style, selectedPaymentMethod === "CASH" ? selectedStyle : normalStyle);
      eftNotice.style.display = selectedPaymentMethod === "EFT" ? "block" : "none";
    };

    function getStoreId() {
      return new URLSearchParams(window.location.search).get("id");
    }

    function getStoreName(store) {
      return store.store_name || store.name || "Store";
    }

    function getStoreImage(store) {
      const category = String(store.category || "").toUpperCase();
      return store.store_image_url || FALLBACK_IMAGES[category] || FALLBACK_IMAGES.DEFAULT;
    }

    function money(value) {
      return Number(value).toLocaleString("en-ZA", {
        style: "currency",
        currency: "ZAR",
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }).replace(/\s/g, "");
    }

    async function loadStorePage() {
      const storeId = getStoreId();

      if (!storeId) {
        $("store-hero-box").innerHTML =
          '<div class="empty-box">No store selected. <a href="index.html">Return to Marketplace</a></div>';
        $("services-menu-box").style.display = "none";
        return;
      }

      try {
        const { data: store, error: storeErr } = await supabase
          .from("stores")
          .select("*")
          .eq("id", storeId)
          .single();

        if (storeErr) {
  console.error("Store query failed:", storeErr);

  throw new Error(
    `Store query failed (${storeErr.code || "unknown"}): ` +
    `${storeErr.message || "Unknown error"}` +
    (storeErr.hint ? ` — ${storeErr.hint}` : "")
  );
}

if (!store) {
  throw new Error("No store row was returned for ID: " + storeId);
}

        storeData = store;

        const expiryTime = store.subscription_expires_at
          ? Date.parse(store.subscription_expires_at)
          : NaN;

        const status = String(store.status || "").toLowerCase();
        const isSubscriptionValid =
          status === "active" &&
          Number.isFinite(expiryTime) &&
          expiryTime > Date.now();

        if (!isSubscriptionValid) {
          $("store-hero-box").innerHTML = `
            <div class="empty-box" style="padding:40px 16px">
              <div style="font-size:42px;color:var(--warning);margin-bottom:12px">
                <i class="ph ph-lock-key"></i>
              </div>
              <h2 style="color:var(--primary);font-size:20px">Store Temporarily Unavailable</h2>
              <p style="line-height:1.7">This store is not currently accepting bookings.</p>
              <a href="index.html" class="btn-book" style="display:inline-block;text-decoration:none;padding:11px 18px">Return to Marketplace</a>
            </div>`;
          $("services-menu-box").replaceChildren();
          return;
        }

        const storeName = getStoreName(store);
        const hero = document.createElement("div");
        hero.innerHTML = `
          <img src="${escapeHTML(getStoreImage(store))}" class="hero-banner" alt="${escapeHTML(storeName)}">
          <div class="hero-content">
            <div class="store-title-row">
              <h1 class="store-title">${escapeHTML(storeName)}</h1>
              <span class="store-badge">${escapeHTML(store.category || "SPOT")}</span>
            </div>
            <div class="store-meta-list">
              <span class="meta-item rating-item"><i class="ph-fill ph-star"></i> 5.0 (24 reviews)</span>
              <span class="meta-item"><i class="ph ph-map-pin"></i> Verified Location</span>
              <span class="meta-item"><i class="ph ph-check-circle" style="color:var(--success)"></i> Open for Booking</span>
            </div>
          </div>`;
        $("store-hero-box").replaceChildren(...hero.childNodes);

        const { data: services, error: serviceErr } = await supabase
          .from("service_items")
          .select("*")
          .eq("store_id", storeId)
          .order("created_at", { ascending: false });

        if (serviceErr) throw serviceErr;

        const menuBox = $("services-menu-box");
        menuBox.replaceChildren();

        if (!services || services.length === 0) {
          menuBox.innerHTML = '<div class="empty-box">No menu items published by this store yet.</div>';
          return;
        }

        // Use South African local calendar dates for sale periods.
        const now = new Date();
        const todayStr = [
          now.getFullYear(),
          String(now.getMonth() + 1).padStart(2, "0"),
          String(now.getDate()).padStart(2, "0")
        ].join("-");

        services.forEach(s => {
          const photos = Array.isArray(s.image_urls)
            ? s.image_urls.filter(url => typeof url === "string" && url.trim())
            : [];

          if (!photos.length && typeof s.image_url === "string" && s.image_url.trim()) {
            photos.push(s.image_url);
          }

          const category = String(store.category || "").toUpperCase();
          const defaultImg = photos[0] || FALLBACK_IMAGES[category] || FALLBACK_IMAGES.DEFAULT;

          const regularPrice = Number(s.price);
          const salePrice = Number(s.sale_price);
          const hasValidSalePrice =
            s.sale_price !== null &&
            s.sale_price !== undefined &&
            String(s.sale_price).trim() !== "" &&
            Number.isFinite(salePrice) &&
            salePrice > 0 &&
            Number.isFinite(regularPrice) &&
            regularPrice > 0 &&
            salePrice < regularPrice;

          const isAfterStart = !s.sale_start_date || String(s.sale_start_date).slice(0, 10) <= todayStr;
          const isBeforeEnd = !s.sale_end_date || String(s.sale_end_date).slice(0, 10) >= todayStr;
          const isOnSale = hasValidSalePrice && isAfterStart && isBeforeEnd;
          const activePrice = isOnSale ? salePrice : regularPrice;

          const card = document.createElement("article");
          card.className = "menu-card";

          if (isOnSale) {
            const saleTag = document.createElement("span");
            saleTag.className = "sale-tag";
            saleTag.textContent = "ON SALE";
            card.appendChild(saleTag);
          }

          const imgWrapper = document.createElement("div");
          imgWrapper.className = "menu-img-wrapper";

          const coverImg = document.createElement("img");
          coverImg.className = "menu-cover-img";
          coverImg.src = defaultImg;
          coverImg.alt = s.title || "Service image";
          coverImg.loading = "lazy";

          const zoomIcon = document.createElement("span");
          zoomIcon.className = "zoom-overlay";
          zoomIcon.innerHTML = '<i class="ph ph-arrows-out-simple"></i>';

          imgWrapper.append(coverImg, zoomIcon);
          imgWrapper.addEventListener("click", () => openLightbox(coverImg.src));
          card.appendChild(imgWrapper);

          if (photos.length > 1) {
            const strip = document.createElement("div");
            strip.className = "thumb-strip";

            photos.forEach((photoUrl, idx) => {
              const thumb = document.createElement("img");
              thumb.className = `thumb-btn ${idx === 0 ? "active" : ""}`;
              thumb.src = photoUrl;
              thumb.alt = `Service image ${idx + 1}`;
              thumb.loading = "lazy";

              thumb.addEventListener("click", event => {
                event.stopPropagation();
                coverImg.src = photoUrl;
                strip.querySelectorAll(".thumb-btn").forEach(btn => btn.classList.remove("active"));
                thumb.classList.add("active");
              });

              strip.appendChild(thumb);
            });

            card.appendChild(strip);
          }

          const body = document.createElement("div");
          body.className = "menu-body";

          const topInfo = document.createElement("div");
          const title = document.createElement("h3");
          title.className = "menu-title";
          title.textContent = s.title || "Service";

          const duration = document.createElement("div");
          duration.className = "menu-duration";
          duration.innerHTML = `<i class="ph ph-clock"></i> ~${Number(s.duration_minutes) > 0 ? Number(s.duration_minutes) : 30} mins`;

          topInfo.append(title, duration);

          const footer = document.createElement("div");
          footer.className = "menu-footer";

          const priceContainer = document.createElement("div");
          priceContainer.className = "price-container";

          if (isOnSale) {
            const original = document.createElement("span");
            original.className = "original-price";
            original.textContent = money(regularPrice);

            const sale = document.createElement("span");
            sale.className = "menu-price";
            sale.textContent = money(activePrice);

            priceContainer.append(original, sale);
          } else {
            const normal = document.createElement("span");
            normal.className = "menu-price normal";
            normal.textContent = money(activePrice);
            priceContainer.appendChild(normal);
          }

          const bookBtn = document.createElement("button");
          bookBtn.type = "button";
          bookBtn.className = "btn-book";
          bookBtn.textContent = "Book";
          bookBtn.addEventListener("click", () => {
            if (!Number.isFinite(activePrice) || activePrice <= 0) {
              alert("This service does not have a valid price yet. Please contact the shop.");
              return;
            }
            openBookingModal(s.id, s.title || "Service", activePrice);
          });

          footer.append(priceContainer, bookBtn);
          body.append(topInfo, footer);
          card.appendChild(body);
          menuBox.appendChild(card);
        });
      } catch (err) {
        console.error("Store load error:", err);
        $("store-hero-box").innerHTML =
          `<div class="empty-box">Error loading store: ${escapeHTML(err.message || "Please try again.")}</div>`;
      }
    }

    function openLightbox(imageSrc) {
      $("lightbox-img").src = imageSrc;
      $("lightbox-modal").style.display = "flex";
    }

    function openBookingModal(serviceId, title, price) {
      selectedService = {
        storeId: storeData.id,
        serviceId,
        title,
        price
      };

      $("modal-service-title").textContent = `${title} (${money(price)})`;
      $("booking-modal").style.display = "flex";
    }

    async function confirmBooking() {
      const name = $("customer-name").value.trim();
      const phone = $("customer-phone").value.trim();
      const button = $("confirm-booking-btn");

      if (!name || !phone) {
        alert("Please enter your name and phone number.");
        return;
      }

      if (!selectedService) return;

      button.disabled = true;
      button.textContent = "Submitting Booking...";

      try {
        // Refresh subscription status before allowing a new booking.
        const { data: currentStore, error: currentStoreError } = await supabase
          .from("stores")
          .select("id,status,subscription_expires_at")
          .eq("id", selectedService.storeId)
          .single();

        if (currentStoreError) throw currentStoreError;

        const expiry = currentStore?.subscription_expires_at
          ? Date.parse(currentStore.subscription_expires_at)
          : NaN;

        if (
          String(currentStore?.status || "").toLowerCase() !== "active" ||
          !Number.isFinite(expiry) ||
          expiry <= Date.now()
        ) {
          $("booking-modal").style.display = "none";
          alert("This store is no longer accepting bookings.");
          button.disabled = false;
          button.textContent = "Confirm Appointment";
          return;
        }

        const paymentRef = generatePaymentRef();
        const todayStart = new Date();
        todayStart.setHours(0, 0, 0, 0);

        const { data: todayBookings, error: countError } = await supabase
          .from("bookings")
          .select("id")
          .eq("store_id", selectedService.storeId)
          .gte("created_at", todayStart.toISOString())
          .neq("status", "cancelled");

        if (countError) throw countError;

        const queueNumber = (todayBookings ? todayBookings.length : 0) + 1;

        const { data: bookingData, error } = await supabase
          .from("bookings")
          .insert([{
            store_id: selectedService.storeId,
            service_id: selectedService.serviceId,
            customer_name: name,
            customer_phone: phone,
            payment_method: selectedPaymentMethod,
            payment_status: "UNPAID",
            status: "pending",
            payment_ref: paymentRef,
            queue_number: queueNumber,
            booked_price: selectedService.price
          }])
          .select()
          .single();

        if (error) throw error;

        const storeShopName = getStoreName(storeData);
        const rawStorePhone = storeData?.phone_number || "";
        const cleanStorePhone = String(rawStorePhone).replace(/[^0-9]/g, "");

        const bankName = storeData?.bank_name || "Request on WhatsApp";
        const accHolder = storeData?.account_holder || storeData?.account_name || storeShopName;
        const accNumber = storeData?.account_number || "Contact Shop";
        const branchCode = storeData?.branch_code || "N/A";

        const paymentNote = selectedPaymentMethod === "EFT"
          ? `Direct EFT (Ref: ${paymentRef})`
          : `Pay cash at store (Ref: ${paymentRef})`;

        const message = encodeURIComponent(
          `Hi ${storeShopName}! I just booked "${selectedService.title}" (${money(selectedService.price)}) on BOOK.NOW.\n\nMy Name: ${name}\nMy Phone: ${phone}\nPayment Ref: ${paymentRef}\nPayment Method: ${paymentNote}\nQueue Position: #${queueNumber}\n\nPlease confirm my appointment slot!`
        );

        const whatsappUrl = cleanStorePhone
          ? `https://wa.me/${cleanStorePhone}?text=${message}`
          : `https://wa.me/?text=${message}`;

        const qrDataUrl = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(bookingData.id)}`;

        const sheet = document.querySelector("#booking-modal .modal-sheet");
        sheet.innerHTML = `
          <div style="text-align:center;padding:10px 0">
            <div style="background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;padding:10px 12px;border-radius:10px;font-size:12px;font-weight:800;margin-bottom:12px">
              QUEUE POSITION: #${queueNumber} FOR TODAY
            </div>

            <div style="background:#f8fafc;border:1px solid var(--border);padding:14px;border-radius:12px;margin-bottom:14px;text-align:left;font-size:13px">
              <div style="font-weight:800;color:var(--primary);margin-bottom:8px">
                <i class="ph ph-bank"></i> Official Bank Account for ${escapeHTML(storeShopName)}
              </div>
              <div style="margin-bottom:4px"><strong>Bank:</strong> ${escapeHTML(bankName)}</div>
              <div style="margin-bottom:4px"><strong>Account Name:</strong> ${escapeHTML(accHolder)}</div>
              <div style="margin-bottom:4px"><strong>Account Number:</strong> ${escapeHTML(accNumber)}</div>
              <div style="margin-bottom:8px"><strong>Branch Code:</strong> ${escapeHTML(branchCode)}</div>
              <div style="background:#fff;padding:10px;border-radius:8px;border:1px solid #cbd5e1;text-align:center">
                <span style="font-size:10px;color:var(--muted);display:block;text-transform:uppercase;font-weight:800">Mandatory Payment Reference</span>
                <span style="font-size:19px;font-weight:800;color:var(--accent);font-family:monospace">${escapeHTML(paymentRef)}</span>
              </div>
            </div>

            <div style="background:#fff;border:2px dashed var(--border);padding:12px;border-radius:14px;margin-bottom:14px;display:inline-block">
              <img src="${qrDataUrl}" alt="Booking QR code" style="width:130px;height:130px;border-radius:8px">
              <div style="font-size:11px;font-weight:800;color:var(--danger);margin-top:5px;text-transform:uppercase">STATUS: UNPAID (REF: ${escapeHTML(paymentRef)})</div>
            </div>

            <a href="${whatsappUrl}" target="_blank" rel="noopener noreferrer" class="btn-book" style="display:block;width:100%;text-decoration:none;padding:14px;font-size:14px;background:#25d366;color:white;border-radius:10px;font-weight:800;margin-bottom:10px">
              <i class="ph ph-whatsapp-logo" style="font-size:17px;vertical-align:middle"></i>
              Send Booking Details on WhatsApp
            </a>

            <button type="button" id="booking-done-btn" style="background:none;border:none;color:var(--muted);font-size:13px;font-weight:800;cursor:pointer;padding:10px">
              Done / Close
            </button>
          </div>
        `;

        $("booking-done-btn").addEventListener("click", () => window.location.reload());
      } catch (error) {
        console.error("Booking error:", error);
        alert("Booking failed: " + (error.message || "Please try again."));
        button.disabled = false;
        button.textContent = "Confirm Appointment";
      }
    }

    function init() {
      if (!window.supabase) {
        $("store-hero-box").innerHTML =
          '<div class="empty-box">Unable to load the booking service. Please refresh the page.</div>';
        return;
      }

      supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      $("close-modal-btn").addEventListener("click", () => {
        $("booking-modal").style.display = "none";
      });

      $("confirm-booking-btn").addEventListener("click", confirmBooking);

      $("close-lightbox").addEventListener("click", () => {
        $("lightbox-modal").style.display = "none";
      });

      $("lightbox-modal").addEventListener("click", event => {
        if (event.target === $("lightbox-modal")) {
          $("lightbox-modal").style.display = "none";
        }
      });

      $("booking-modal").addEventListener("click", event => {
        if (event.target === $("booking-modal")) {
          $("booking-modal").style.display = "none";
        }
      });

      loadStorePage();
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", init, { once: true });
    } else {
      init();
    }
  })();
  </script>
</body>
</html>
