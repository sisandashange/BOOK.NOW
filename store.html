<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Store Front — BOOK.NOW</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --primary: #0f172a; --accent: #2563eb; --bg: #f8fafc; --surface: #ffffff;
      --text: #0f172a; --muted: #64748b; --border: #e2e8f0; --success: #16a34a;
      --warning: #d97706; --danger: #dc2626; --radius: 16px;
    }
    * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; padding: 0; background: var(--bg); color: var(--text); padding-bottom: 80px; }
    .top-nav { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 30; }
    .back-btn { display: inline-flex; align-items: center; gap: 5px; text-decoration: none; color: var(--primary); font-size: 12px; font-weight: 700; background: #f1f5f9; padding: 6px 12px; border-radius: 8px; }
    .brand { font-size: 16px; font-weight: 800; display: flex; align-items: center; gap: 6px; color: var(--primary); }
    .container { padding: 14px 12px; max-width: 850px; margin: 0 auto; }
    .store-hero { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); overflow: hidden; margin-bottom: 18px; }
    .hero-banner { width: 100%; height: 180px; object-fit: cover; background: #e2e8f0; display: block; }
    .hero-content { padding: 16px; }
    .store-title-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .store-title { font-size: 20px; font-weight: 800; margin: 0; color: var(--primary); }
    .store-badge { font-size: 9px; font-weight: 800; background: #f1f5f9; color: var(--muted); padding: 3px 8px; border-radius: 5px; text-transform: uppercase; }
    .store-meta-list { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; font-size: 12px; color: var(--muted); }
    .meta-item { display: inline-flex; align-items: center; gap: 4px; font-weight: 600; }
    .section-title { font-size: 16px; font-weight: 800; margin: 0 0 12px 0; color: var(--primary); display: flex; align-items: center; gap: 6px; }
    .menu-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .menu-card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); overflow: hidden; display: flex; flex-direction: column; min-width: 0; position: relative; }
    .menu-img-wrapper { position: relative; width: 100%; aspect-ratio: 4 / 3; background: #f1f5f9; cursor: pointer; overflow: hidden; }
    .menu-cover-img { width: 100%; height: 100%; object-fit: cover; }
    .menu-body { padding: 10px; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; gap: 8px; }
    .menu-title { font-size: 13px; font-weight: 800; color: var(--primary); margin: 0; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .menu-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 2px; padding-top: 6px; border-top: 1px solid #f1f5f9; }
    .menu-price { font-size: 13px; font-weight: 800; color: var(--primary); display: flex; align-items: center; }
    .btn-book { background: var(--accent); color: white; border: none; padding: 6px 10px; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; transition: background 0.2s; }
    .btn-book:hover { background: #1d4ed8; }
    .empty-box { text-align: center; padding: 36px 12px; background: var(--surface); border-radius: 14px; border: 1px dashed var(--border); color: var(--muted); font-size: 13px; grid-column: 1 / -1; }
  </style>
</head>
<body>
  <div class="top-nav">
    <a href="index.html" class="back-btn"><i class="ph ph-arrow-left"></i> All Spots</a>
    <div class="brand"><i class="ph ph-calendar-check" style="color: var(--accent);"></i> BOOK.NOW</div>
  </div>
  <div class="container">
    <div id="store-hero-box" class="store-hero"><div class="empty-box">Loading store info...</div></div>
    <div class="section-title"><i class="ph ph-squares-four" style="color:var(--accent);"></i> Services & Menu</div>
    <div id="services-menu-box" class="menu-grid"><div class="empty-box">Loading menu items...</div></div>
  </div>

  <script>
  (() => {
    "use strict";
    const SUPABASE_URL = "https://pvplhsiafklaoqrpdhpd.supabase.co";
    const SUPABASE_KEY = "sb_publishable_VKlDPkR9JvJr6E4bcz1HSg_OG5_xy5r";
    let supabase = null;

    const $ = id => document.getElementById(id);

    async function loadStorePage() {
      const params = new URLSearchParams(window.location.search);
      const storeId = params.get("id");

      if (!storeId) {
        $("store-hero-box").innerHTML = '<div class="empty-box">No store selected. <a href="index.html">Return to Marketplace</a></div>';
        $("services-menu-box").replaceChildren();
        return;
      }

      try {
        const { data: store, error } = await supabase
          .from("stores")
          .select("id, store_name, category, address, store_image_url, status, subscription_expires_at")
          .eq("id", storeId)
          .maybeSingle();

        if (error) throw error;

        if (!store) {
          $("store-hero-box").innerHTML = '<div class="empty-box">Store not found or unavailable.</div>';
          $("services-menu-box").replaceChildren();
          return;
        }

        const expiryTime = store.subscription_expires_at
          ? Date.parse(store.subscription_expires_at)
          : NaN;

        const isSubscriptionValid =
          store.status === "active" &&
          Number.isFinite(expiryTime) &&
          expiryTime > Date.now();

        if (!isSubscriptionValid) {
          $("store-hero-box").innerHTML = `
            <div class="empty-box" style="padding:40px 16px;">
              <div style="font-size:42px;color:var(--warning);margin-bottom:12px;">
                <i class="ph ph-lock-key"></i>
              </div>
              <h2 style="color:var(--primary);font-size:19px;">
                Store Temporarily Unavailable
              </h2>
              <p style="line-height:1.7;">
                This store is not currently accepting bookings.
                Please check back later.
              </p>
              <a href="index.html" class="btn-book"
                 style="display:inline-block;text-decoration:none;padding:10px 18px;">
                Return to Marketplace
              </a>
            </div>
          `;
          $("services-menu-box").replaceChildren();
          return;
        }

        const escapeHtml = value =>
          String(value ?? "").replace(/[&<>"']/g, char => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
          })[char]);

        const safeImageUrl = value => {
          try {
            const url = new URL(value || "");
            return url.protocol === "https:" ? url.href : "";
          } catch {
            return "";
          }
        };

        const storeName = escapeHtml(store.store_name || "BOOK.NOW Store");
        const category = escapeHtml(store.category || "SPOT");
        const address = escapeHtml(store.address || "Location not provided");
        const imageUrl = safeImageUrl(store.store_image_url);

        $("store-hero-box").innerHTML = `
          ${imageUrl
            ? `<img src="${escapeHtml(imageUrl)}" class="hero-banner" alt="${storeName}">`
            : ""}
          <div class="hero-content">
            <div class="store-title-row">
              <h1 class="store-title">${storeName}</h1>
              <span class="store-badge">${category}</span>
            </div>
            <div class="store-meta-list">
              <span class="meta-item">
                <i class="ph ph-map-pin"></i> ${address}
              </span>
              <span class="meta-item" style="color:var(--success);">
                <i class="ph ph-check-circle"></i> Open for Booking
              </span>
            </div>
          </div>
        `;

        // Query service items including promotional sale columns
        const { data: services, error: servicesError } = await supabase
          .from("service_items")
          .select("id, store_id, title, price, sale_price, sale_start_date, sale_end_date, image_urls")
          .eq("store_id", storeId);

        if (servicesError) throw servicesError;

        const menuBox = $("services-menu-box");
        menuBox.replaceChildren();

        if (!services || services.length === 0) {
          menuBox.innerHTML = '<div class="empty-box">No menu items published yet.</div>';
          return;
        }

        const today = new Date().toISOString().split("T")[0];

        services.forEach(service => {
          const card = document.createElement("div");
          card.className = "menu-card";

          const title = escapeHtml(service.title || "Service");
          const standardPrice = Number(service.price);
          const salePrice = Number(service.sale_price);

          const hasSale = Number.isFinite(salePrice) && salePrice >= 0 &&
            (!service.sale_start_date || service.sale_start_date <= today) &&
            (!service.sale_end_date || service.sale_end_date >= today);

          const priceHtml = hasSale
            ? `<span style="text-decoration: line-through; color: var(--muted); font-size: 11px; margin-right: 4px;">R${standardPrice.toFixed(2)}</span><span style="color: var(--success);">R${salePrice.toFixed(2)}</span>`
            : (Number.isFinite(standardPrice) && standardPrice >= 0 ? `R${standardPrice.toFixed(2)}` : "Price on request");

          const serviceImage = Array.isArray(service.image_urls)
            ? safeImageUrl(service.image_urls[0])
            : "";

          card.innerHTML = `
            <div class="menu-img-wrapper">
              ${serviceImage
                ? `<img src="${escapeHtml(serviceImage)}" class="menu-cover-img" alt="${title}">`
                : ""}
            </div>
            <div class="menu-body">
              <h3 class="menu-title">${title}</h3>
              <div class="menu-footer">
                <span class="menu-price">${priceHtml}</span>
                <button class="btn-book" onclick="alert('Booking flow triggered for: ${title}')">
                  Book Now
                </button>
              </div>
            </div>
          `;

          menuBox.appendChild(card);
        });

      } catch (err) {
        console.error("Store loading failed:", err);
        $("store-hero-box").innerHTML =
          '<div class="empty-box">Unable to load this store right now. Please try again later.</div>';
        $("services-menu-box").replaceChildren();
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      loadStorePage();
    });
  })();
  </script>
</body>
</html>
