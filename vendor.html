<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Partner Portal — BOOK.NOW</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --primary: #0f172a;
      --accent: #2563eb;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --success: #16a34a;
      --warning: #d97706;
      --radius: 16px;
    }

    * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { margin: 0; padding: 0; background: var(--bg); color: var(--text); padding-bottom: 60px; }

    .top-bar { background: var(--surface); padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; sticky; top:0; z-index: 10; }
    .brand { font-size: 16px; font-weight: 800; display: flex; align-items: center; gap: 8px; color: var(--primary); }

    .container { max-width: 900px; margin: 0 auto; padding: 16px; }

    .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 16px; }
    .stat-card { background: var(--surface); border: 1px solid var(--border); padding: 16px; border-radius: var(--radius); }
    .stat-label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; }
    .stat-val { font-size: 22px; font-weight: 800; color: var(--primary); margin-top: 4px; }

    .sub-card { background: #eff6ff; border: 1px solid #bfdbfe; border-radius: var(--radius); padding: 14px 16px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
    .sub-title { font-size: 13px; font-weight: 800; color: #1e40af; }
    .sub-desc { font-size: 11px; color: #3b82f6; margin-top: 2px; }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; }
    .card-title { font-size: 15px; font-weight: 800; margin: 0 0 12px 0; display: flex; justify-content: space-between; align-items: center; }

    .order-item { border: 1px solid var(--border); padding: 12px; border-radius: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; background: #fafafa; }
    .order-user { font-size: 13px; font-weight: 800; color: var(--primary); }
    .order-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .badge { font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 6px; text-transform: uppercase; }
    .badge-pending { background: #fef3c7; color: #b45309; }
    .badge-completed { background: #dcfce7; color: #15803d; }

    .btn { background: var(--accent); color: white; border: none; padding: 8px 14px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; }
    .btn-success { background: var(--success); }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="brand">
      <i class="ph ph-storefront" style="font-size:22px; color:var(--accent);"></i> Partner Portal
    </div>
    <span class="badge badge-completed">100% Direct Payout</span>
  </div>

  <div class="container">
    
    <!-- SUBSCRIPTION STATUS BANNER -->
    <div class="sub-card">
      <div>
        <div class="sub-title"><i class="ph ph-check-circle"></i> Subscription Active (R299/month)</div>
        <div class="sub-desc">You keep 100% of all booking revenues. Next billing date: 1st of next month.</div>
      </div>
      <button class="btn" onclick="alert('Subscription is active and up to date!')">Status</button>
    </div>

    <!-- METRICS -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Total Revenue (100%)</div>
        <div class="stat-val" id="total-revenue">R0.00</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Completed Bookings</div>
        <div class="stat-val" id="completed-count">0</div>
      </div>
    </div>

    <!-- LIVE APPOINTMENTS -->
    <div class="card">
      <div class="card-title">
        <span>Live Appointments</span>
        <i class="ph ph-calendar" style="color:var(--muted);"></i>
      </div>
      <div id="orders-list">Loading appointments...</div>
    </div>

  </div>

  <script>
    const SUPABASE_URL = "https://pvplhsiafklaoqrpdhpd.supabase.co";
    const SUPABASE_KEY = "sb_publishable_VKlDPkR9JvJr6E4bcz1HSg_OG5_xy5r";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function loadPartnerData() {
      try {
        const { data: orders, error } = await supabase
          .from("orders")
          .select("*")
          .order("created_at", { ascending: false });

        if (error) throw error;

        let totalRev = 0;
        let completedCount = 0;
        const list = document.getElementById("orders-list");
        list.innerHTML = "";

        if (!orders || orders.length === 0) {
          list.innerHTML = '<div style="font-size:12px; color:var(--muted); text-align:center; padding:16px;">No appointments logged yet.</div>';
          return;
        }

        orders.forEach(o => {
          if (o.status === "COMPLETED") {
            totalRev += Number(o.gross_amount || 0);
            completedCount++;
          }

          const item = document.createElement("div");
          item.className = "order-item";
          item.innerHTML = `
            <div>
              <div class="order-user">${o.customer_name || 'Customer'} (${o.customer_phone || 'N/A'})</div>
              <div class="order-meta">${new Date(o.created_at).toLocaleString()} • Method: ${o.payment_method || 'EFT'}</div>
              <span class="badge ${o.status === 'COMPLETED' ? 'badge-completed' : 'badge-pending'}" style="margin-top:4px; display:inline-block;">${o.status}</span>
            </div>
            <div style="text-align:right;">
              <div style="font-size:14px; font-weight:800; color:var(--primary);">R${Number(o.gross_amount).toFixed(2)}</div>
              ${o.status === 'PENDING' ? `<button class="btn btn-success" style="margin-top:6px;" onclick="completeOrder('${o.id}')">Complete</button>` : ''}
            </div>
          `;
          list.appendChild(item);
        });

        document.getElementById("total-revenue").textContent = `R${totalRev.toFixed(2)}`;
        document.getElementById("completed-count").textContent = completedCount;

      } catch (err) {
        console.error("Error loading partner portal:", err);
      }
    }

    async function completeOrder(orderId) {
      const { error } = await supabase
        .from("orders")
        .update({ status: "COMPLETED", payment_status: "PAID" })
        .eq("id", orderId);

      if (error) alert("Error completing booking: " + error.message);
      else loadPartnerData();
    }

    document.addEventListener("DOMContentLoaded", loadPartnerData);
  </script>
</body>
</html>
