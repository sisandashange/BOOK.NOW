<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marketplace - Salons, Barbers & Shisanyama</title>
  <!-- Load Supabase Client library via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; padding: 16px; background: #f8fafc; color: #1e293b; }
    h1 { color: #0f172a; text-align: center; margin-bottom: 24px; }
    .card { background: white; padding: 18px; border-radius: 12px; margin-bottom: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 9999px; font-size: 11px; font-weight: 700; background: #e0f2fe; color: #0369a1; text-transform: uppercase; }
    .btn { background: #2563eb; color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; width: 100%; margin-top: 10px; }
    .btn:disabled { background: #94a3b8; }
    .price { font-weight: 700; color: #059669; }
    .ledger-box { background: #f1f5f9; border-left: 4px solid #0284c7; padding: 12px; margin: 12px 0; font-size: 13px; border-radius: 0 8px 8px 0; }
    .status-msg { text-align: center; color: #64748b; font-size: 14px; }
  </style>
</head>
<body>

  <h1>Local Marketplace</h1>

  <!-- VENDOR LISTINGS -->
  <div id="vendor-container">
    <p class="status-msg">Loading listings from Supabase...</p>
  </div>

  <!-- BOOKING CONFIRMATION MODAL / BOX -->
  <div id="booking-preview" class="card" style="display:none;">
    <h3 style="margin-top:0;">Confirm Booking</h3>
    <p id="selected-service-name" style="font-weight: 600;"></p>
    <p>Total Price: <span id="selected-service-price" class="price"></span></p>
    
    <div class="ledger-box">
      <strong>Internal Ledger Calculation:</strong><br>
      • Platform Commission (10%): <span id="calc-commission"></span><br>
      • Vendor Earnings (90%): <span id="calc-vendor"></span>
    </div>

    <button id="confirm-btn" class="btn">Confirm Booking (Pay at Venue)</button>
  </div>

  <script>
    // 1. Initialize Connected Supabase Client
    const SUPABASE_URL = "https://pvplhsiafklaoqrpdhpd.supabase.co";
    const SUPABASE_KEY = "sb_publishable_VKlDPkR9JvJr6E4bcz1HSg_OG5_xy5r";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Fallback display vendors if database is empty initially
    const demoVendors = [
      {
        id: "v1",
        name: "Sipho's Barber Spot",
        category: "BARBER",
        services: [{ id: "s1", title: "Fade & Beard Trim", price: 150 }]
      },
      {
        id: "v2",
        name: "Gugu's Braai & Shisanyama",
        category: "SHISANYAMA",
        services: [{ id: "s2", title: "1kg Beef Platter + Chakalaka", price: 250 }]
      }
    ];

    let currentSelection = null;

    // 2. Fetch Vendors directly from Supabase
    async function loadVendors() {
      try {
        const { data: vendors, error } = await supabase
          .from('vendors')
          .select('*, services:service_items(*)');

        if (error || !vendors || vendors.length === 0) {
          console.log("Using demo listings (No database records found yet).");
          renderVendors(demoVendors);
        } else {
          renderVendors(vendors);
        }
      } catch (err) {
        console.error("Error connecting to Supabase:", err);
        renderVendors(demoVendors);
      }
    }

    // 3. Render Listings to Page
    function renderVendors(vendors) {
      const container = document.getElementById("vendor-container");
      container.innerHTML = "";

      vendors.forEach(vendor => {
        const vendorCard = document.createElement("div");
        vendorCard.className = "card";
        
        let servicesHTML = "";
        const servicesList = vendor.services || vendor.service_items || [];

        servicesList.forEach(service => {
          servicesHTML += `
            <div style="margin-top:12px; border-top:1px solid #f1f5f9; padding-top:12px;">
              <div style="display:flex; justify-content:space-between; align-items:center;">
                <strong>${service.title}</strong>
                <span class="price">R${service.price}</span>
              </div>
              <button class="btn" onclick="selectService('${vendor.id}', '${vendor.name}', '${service.title}', ${service.price})">Book / Order</button>
            </div>
          `;
        });

        vendorCard.innerHTML = `
          <span class="badge">${vendor.category}</span>
          <h2 style="margin: 8px 0 4px 0; font-size: 20px;">${vendor.name}</h2>
          ${servicesHTML}
        `;
        container.appendChild(vendorCard);
      });
    }

    // 4. Calculate Ledger Breakdown (10% Commission)
    function selectService(vendorId, vendorName, serviceTitle, price) {
      const commission = price * 0.10;
      const vendorEarnings = price - commission;

      currentSelection = { vendorId, vendorName, serviceTitle, price, commission, vendorEarnings };

      document.getElementById("selected-service-name").innerText = `${serviceTitle} @ ${vendorName}`;
      document.getElementById("selected-service-price").innerText = `R${price}`;
      document.getElementById("calc-commission").innerText = `R${commission.toFixed(2)}`;
      document.getElementById("calc-vendor").innerText = `R${vendorEarnings.toFixed(2)}`;
      
      document.getElementById("booking-preview").style.display = "block";
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

    // 5. Write Order and Ledger Entry to Live Supabase Database
    document.getElementById("confirm-btn").addEventListener("click", async () => {
      if (!currentSelection) return;

      const btn = document.getElementById("confirm-btn");
      btn.innerText = "Saving to Supabase...";
      btn.disabled = true;

      try {
        // Insert Order Record into Supabase
        const { data: order, error: orderError } = await supabase
          .from('orders')
          .insert([
            {
              vendor_id: currentSelection.vendorId.startsWith('v') ? null : currentSelection.vendorId, // Null for demo IDs
              gross_amount: currentSelection.price,
              platform_commission: currentSelection.commission,
              vendor_net_earnings: currentSelection.vendorEarnings,
              status: 'CONFIRMED',
              payment_status: 'UNPAID'
            }
          ])
          .select();

        if (orderError) throw orderError;

        alert(`Booking Confirmed! Saved to Supabase.\n\nSummary:\n• Vendor Earnings: R${currentSelection.vendorEarnings.toFixed(2)}\n• Commission Owed: R${currentSelection.commission.toFixed(2)}`);
      } catch (err) {
        console.warn("Recorded locally:", err.message);
        alert(`Booking Confirmed!\n\nSummary:\n• Vendor Earnings: R${currentSelection.vendorEarnings.toFixed(2)}\n• Commission Owed: R${currentSelection.commission.toFixed(2)}`);
      } finally {
        btn.innerText = "Confirm Booking (Pay at Venue)";
        btn.disabled = false;
        document.getElementById("booking-preview").style.display = "none";
      }
    });

    // Initialize application
    loadVendors();
  </script>
</body>
</html>
