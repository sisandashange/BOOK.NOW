<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BOOK.NOW — Discover & Book Local Spots</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --primary: #0f172a;
      --accent: #2563eb;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --success: #16a34a;
      --radius: 16px;
    }

    * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; padding: 0; background: var(--bg); color: var(--text); padding-bottom: 60px; }

    .top-nav { background: var(--surface); padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 20; }
    .brand { font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 8px; color: var(--primary); }
    .partner-link { font-size: 12px; font-weight: 600; color: var(--accent); text-decoration: none; background: #eff6ff; padding: 6px 10px; border-radius: 8px; }

    .container { padding: 16px 20px; max-width: 650px; margin: 0 auto; }

    .hero { margin-bottom: 20px; }
    .hero h1 { font-size: 22px; font-weight: 700; margin: 0 0 6px 0; }
    .hero p { font-size: 13px; color: var(--muted); margin: 0; }

    .filter-bar { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 4px; }
    .filter-chip { background: var(--surface); border: 1px solid var(--border); padding: 8px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; color: var(--muted); }
    .filter-chip.active { background: var(--primary); color: white; border-color: var(--primary); }

    .card-list { display: flex; flex-direction: column; gap: 14px; }
    .vendor-card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); overflow: hidden; padding: 16px; }
    .vendor-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .vendor-title { font-size: 16px; font-weight: 700; margin: 0; }
    .vendor-category { font-size: 11px; font-weight: 700; background: #e0f2fe; color: #0369a1; padding: 3px 8px; border-radius: 6px; text-transform: uppercase; }

    .service-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-top: 1px solid var(--border); }
    .service-info { font-size: 14px; font-weight: 600; }
    .service-price-book { display: flex; align-items: center; gap: 12px; }
    .service-price { font-weight: 700; color: var(--success); font-size: 15px; }
    .btn-book { background: var(--accent); color: white; border: none; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; }

    .modal { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: flex-end; z-index: 100; }
    .modal-sheet { background: #fff; width: 100%; max-width: 600px; padding: 24px; border-radius: 24px 24px 0 0; }
    .form-field { margin-bottom: 14px; }
    .form-field label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; }
    .form-field input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); font-size: 14px; outline: none; }

    .empty-box { text-align: center; padding: 40px 16px; background: var(--surface); border-radius: 14px; border: 1px dashed var(--border); color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>

  <div class="top-nav">
    <div class="brand">
      <i class="ph ph-calendar-star" style="font-size:22px; color: var(--accent);"></i>
      BOOK.NOW
    </div>
    <a href="vendor.html" class="partner-link">Partner Login</a>
  </div>

  <div class="container">
    <div class="hero">
      <h1>Book Local Excellence</h1>
      <p>Find and book top-rated barbers, salons, and braai spots near you.</p>
    </div>

    <div class="filter-bar">
      <button class="filter-chip active" id="filter-all">All Spots</button>
      <button class="filter-chip" id="filter-barber">Barbershops</button>
      <button class="filter-chip" id="filter-salon">Salons</button>
      <button class="filter-chip" id="filter-shisanyama">Shisanyama</button>
    </div>

    <div id="marketplace-list" class="card-list">
      <div class="empty-box">Connecting to BOOK.NOW...</div>
    </div>
  </div>

  <!-- BOOKING MODAL -->
  <div id="booking-modal" class="modal">
    <div class="modal-sheet">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
        <h3 id="modal-service-title" style="margin:0; font-size:16px; font-weight:700;">Complete Booking</h3>
        <i class="ph ph-x" id="close-modal-btn" style="font-size:20px; cursor:pointer;"></i>
      </div>
      <div class="form-field">
        <label for="customer-name">Your Name</label>
        <input type="text" id="customer-name" placeholder="e.g. Sipho Dlamini">
      </div>
      <div class="form-field">
        <label for="customer-phone">Phone Number</label>
        <input type="tel" id="customer-phone" placeholder="e.g. 082 123 4567">
      </div>
      <button class="btn-book" id="confirm-booking-btn" style="width:100%; padding:12px; font-size:14px;">Confirm Appointment</button>
    </div>
  </div>

  <script>
  (() => {
    "use strict";

    const SUPABASE_URL = "https://pvplhsiafklaoqrpdhpd.supabase.co";
    const SUPABASE_KEY = "sb_publishable_VKlDPkR9JvJr6E4bcz1HSg_OG5_xy5r";
    
    let supabase = null;
    let allVendors = [];
    let selectedService = null;
    let booted = false;

    const $ = id => document.getElementById(id);

    function bindEvents() {
      $("close-modal-btn").addEventListener("click", closeModal);
      
      $("filter-all").addEventListener("click", (e) => filterCategory("ALL", e.target));
      $("filter-barber").addEventListener("click", (e) => filterCategory("BARBER", e.target));
      $("filter-salon").addEventListener("click", (e) => filterCategory("SALON", e.target));
      $("filter-shisanyama").addEventListener("click", (e) => filterCategory("SHISANYAMA", e.target));

      $("confirm-booking-btn").addEventListener("click", confirmBooking);
    }

    async function loadMarketplace() {
      const container = $("marketplace-list");
      container.innerHTML = '<div class="empty-box">Connecting to BOOK.NOW...</div>';

      if (!window.supabase) {
        container.textContent = "Supabase library failed to load. Check your internet connection.";
        return;
      }

      if (!supabase) {
        container.textContent = "Supabase client failed to initialize.";
        return;
      }

      try {
        const { data: vendors, error } = await supabase
          .from("vendors")
          .select("id, name, category, created_at")
          .order("created_at", { ascending: false });

        if (error) throw error;

        if (!vendors || vendors.length === 0) {
          allVendors = [];
          container.innerHTML = '<div class="empty-box">No businesses found.</div>';
          return;
        }

        const results = await Promise.all(
          vendors.map(async vendor => {
            const { data: services, error: serviceError } =
              await supabase
                .from("service_items")
                .select("id, vendor_id, title, price")
                .eq("vendor_id", vendor.id);

            if (serviceError) throw serviceError;

            return {
              ...vendor,
              service_items: services || []
            };
          })
        );

        allVendors = results;
        renderVendors(allVendors);

      } catch (error) {
        console.error("Marketplace error:", error);
        container.replaceChildren();

        const message = document.createElement("div");
        message.className = "empty-box";
        message.textContent = "Marketplace error: " + (error.message || "Unknown error");
        container.appendChild(message);
      }
    }

    function renderVendors(vendors) {
      const container = $("marketplace-list");
      container.replaceChildren();

      if (vendors.length === 0) {
        container.innerHTML = '<div class="empty-box">No spots in this category yet.</div>';
        return;
      }

      vendors.forEach(v => {
        const card = document.createElement("div");
        card.className = "vendor-card";

        const header = document.createElement("div");
        header.className = "vendor-header";
        
        const title = document.createElement("h3");
        title.className = "vendor-title";
        title.textContent = v.name || "Unnamed Business";

        const category = document.createElement("span");
        category.className = "vendor-category";
        category.textContent = v.category || "BUSINESS";

        header.append(title, category);
        card.appendChild(header);

        const servicesBox = document.createElement("div");

        if (v.service_items && v.service_items.length > 0) {
          v.service_items.forEach(s => {
            const row = document.createElement("div");
            row.className = "service-row";

            const info = document.createElement("div");
            info.className = "service-info";
            info.textContent = s.title;

            const right = document.createElement("div");
            right.className = "service-price-book";

            const price = document.createElement("span");
            price.className = "service-price";
            price.textContent = `R${Number(s.price).toFixed(2)}`;

            const bookBtn = document.createElement("button");
            bookBtn.className = "btn-book";
            bookBtn.textContent = "Book";
            bookBtn.addEventListener("click", () => openBooking(v.id, s.id, s.title, s.price));

            right.append(price, bookBtn);
            row.append(info, right);
            servicesBox.appendChild(row);
          });
        } else {
          const emptyMsg = document.createElement("div");
          emptyMsg.style.cssText = "font-size:13px; color:var(--muted); padding:6px 0;";
          emptyMsg.textContent = "Menu coming soon";
          servicesBox.appendChild(emptyMsg);
        }

        card.appendChild(servicesBox);
        container.appendChild(card);
      });
    }

    function filterCategory(cat, btn) {
      document.querySelectorAll(".filter-chip").forEach(c => c.classList.remove("active"));
      btn.classList.add("active");

      if (cat === "ALL") {
        renderVendors(allVendors);
      } else {
        const filtered = allVendors.filter(v => v.category === cat);
        renderVendors(filtered);
      }
    }

    function openBooking(vendorId, serviceId, title, price) {
      selectedService = { vendorId, serviceId, title, price };
      $("modal-service-title").textContent = `Book: ${title} (R${price.toFixed(2)})`;
      $("booking-modal").style.display = "flex";
    }

    function closeModal() {
      $("booking-modal").style.display = "none";
    }

    async function confirmBooking() {
      const name = $("customer-name").value.trim();
      const phone = $("customer-phone").value.trim();
      const button = $("confirm-booking-btn");

      if (!name || !phone) {
        alert("Please enter your name and phone number.");
        return;
      }

      if (!selectedService) {
        alert("Please select a service first.");
        return;
      }

      if (!supabase) {
        alert("Connection unavailable. Please refresh and try again.");
        return;
      }

      button.disabled = true;
      button.textContent = "Submitting...";

      try {
        const grossAmount = selectedService.price;
        const netEarnings = grossAmount * 0.90;

        const { error } = await supabase.from("orders").insert([{
          vendor_id: selectedService.vendorId,
          gross_amount: grossAmount,
          vendor_net_earnings: netEarnings,
          status: "PENDING",
          customer_name: name,
          customer_phone: phone
        }]);

        if (error) throw error;

        alert(`Booking confirmed for ${name}! The shop has received your appointment.`);
        closeModal();
        $("customer-name").value = "";
        $("customer-phone").value = "";
        selectedService = null;

      } catch (error) {
        console.error("Booking error:", error);
        alert("Could not submit booking: " + error.message);
      } finally {
        button.disabled = false;
        button.textContent = "Confirm Appointment";
      }
    }

    function boot() {
      if (booted) return;
      booted = true;

      try {
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        bindEvents();
        loadMarketplace();
      } catch (e) {
        console.error("Boot error:", e);
      }
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", boot, { once: true });
    } else {
      boot();
    }
  })();
  </script>
</body>
</html>
