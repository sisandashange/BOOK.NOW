<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marketplace - Salons, Barbers & Shisanyama</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    :root {
      --primary: #0f172a;
      --accent: #2563eb;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --success: #059669;
      --radius: 16px;
    }

    * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; padding: 0; background: var(--bg); color: var(--text); padding-bottom: 40px; }

    header { background: var(--surface); padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; sticky: top; }
    .brand { font-size: 18px; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 8px; }

    .container { padding: 16px 20px; max-width: 600px; margin: 0 auto; }

    .vendor-card { background: var(--surface); padding: 18px; border-radius: var(--radius); border: 1px solid var(--border); margin-bottom: 16px; }
    .badge { display: inline-block; padding: 3px 8px; border-radius: 6px; font-size: 10px; font-weight: 700; background: #e0f2fe; color: #0369a1; text-transform: uppercase; margin-bottom: 6px; }
    .vendor-title { font-size: 18px; font-weight: 700; margin: 0 0 12px 0; }

    .service-row { border-top: 1px solid var(--border); padding-top: 12px; margin-top: 12px; display: flex; justify-content: space-between; align-items: center; }
    .service-name { font-weight: 600; font-size: 14px; }
    .service-price { font-weight: 700; color: var(--success); font-size: 15px; }

    .btn { background: var(--accent); color: white; border: none; padding: 8px 14px; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; }
    .btn:active { transform: scale(0.98); }

    /* BOOKING SHEET */
    .sheet-overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.4); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: flex-end; z-index: 100; }
    .sheet-body { background: #fff; width: 100%; max-width: 600px; padding: 24px; border-radius: 24px 24px 0 0; }
    
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; }
    .field input, .field select { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); font-size: 14px; outline: none; }

    .time-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 6px; }
    .time-slot { border: 1px solid var(--border); padding: 8px; text-align: center; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; background: var(--bg); }
    .time-slot.selected { background: var(--accent); color: white; border-color: var(--accent); }
  </style>
</head>
<body>

  <header>
    <div class="brand"><i class="ph ph-scissors" style="color:var(--accent);"></i> TownBook</div>
    <a href="vendor.html" style="font-size:12px; font-weight:600; color:var(--accent); text-decoration:none;">Partner Login →</a>
  </header>

  <div class="container">
    <h2 style="font-size: 20px; font-weight: 700; margin-bottom: 16px;">Book Local Services</h2>
    <div id="listings-container">
      <p style="color: var(--muted); font-size: 14px;">Loading vendors...</p>
    </div>
  </div>

  <!-- BOOKING SHEET -->
  <div id="booking-sheet" class="sheet-overlay">
    <div class="sheet-body">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <h3 style="margin:0; font-size:18px;" id="sheet-service-title">Confirm Appointment</h3>
        <i class="ph ph-x" style="font-size:20px; cursor:pointer;" onclick="closeSheet()"></i>
      </div>

      <div class="field">
        <label>Your Name</label>
        <input type="text" id="cust-name" placeholder="e.g. Sipho M.">
      </div>

      <div class="field">
        <label>Select Date</label>
        <input type="date" id="cust-date">
      </div>

      <div class="field">
        <label>Select Time Slot</label>
        <div class="time-grid">
          <div class="time-slot" onclick="selectTime('09:00', this)">09:00 AM</div>
          <div class="time-slot" onclick="selectTime('11:00', this)">11:00 AM</div>
          <div class="time-slot" onclick="selectTime('14:00', this)">02:00 PM</div>
          <div class="time-slot" onclick="selectTime('16:00', this)">04:00 PM</div>
        </div>
      </div>

      <button class="btn" style="width:100%; padding:14px; font-size:15px; margin-top:10px;" onclick="confirmBooking()">Confirm Booking (Pay at Venue)</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://pvplhsiafklaoqrpdhpd.supabase.co";
    const SUPABASE_KEY = "sb_publishable_VKlDPkR9JvJr6E4bcz1HSg_OG5_xy5r";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let selectedService = null;
    let selectedTimeSlot = null;

    function closeSheet() { document.getElementById('booking-sheet').style.display = 'none'; }

    function selectTime(time, el) {
      document.querySelectorAll('.time-slot').forEach(s => s.classList.remove('selected'));
      el.classList.add('selected');
      selectedTimeSlot = time;
    }

    async function loadMarketplace() {
      const container = document.getElementById('listings-container');
      const { data: vendors } = await supabase.from('vendors').select('*, services:service_items(*)');

      if (!vendors || vendors.length === 0) {
        container.innerHTML = '<p style="color:var(--muted); font-size:14px;">No businesses listed yet. Add one in the Partner Console!</p>';
        return;
      }

      container.innerHTML = vendors.map(v => `
        <div class="vendor-card">
          <span class="badge">${v.category}</span>
          <h3 class="vendor-title">${v.name}</h3>
          ${(v.services || []).map(s => `
            <div class="service-row">
              <div>
                <div class="service-name">${s.title}</div>
                <div class="service-price">R${s.price}</div>
              </div>
              <button class="btn" onclick='openBooking(${JSON.stringify(v)},${JSON.stringify(s)})'>Book</button>
            </div>
          `).join('')}
        </div>
      `).join('');
    }

    function openBooking(vendor, service) {
      selectedService = { vendor, service };
      document.getElementById('sheet-service-title').innerText = `${service.title} @ ${vendor.name}`;
      document.getElementById('cust-date').valueAsDate = new Date();
      document.getElementById('booking-sheet').style.display = 'flex';
    }

    async function confirmBooking() {
      const custName = document.getElementById('cust-name').value;
      const date = document.getElementById('cust-date').value;

      if (!custName || !date || !selectedTimeSlot) {
        return alert("Please fill in your name, select a date, and pick a time slot.");
      }

      const gross = selectedService.service.price;
      const commission = gross * 0.10;
      const net = gross - commission;

      const { error } = await supabase.from('orders').insert([
        {
          vendor_id: selectedService.vendor.id,
          gross_amount: gross,
          platform_commission: commission,
          vendor_net_earnings: net,
          status: 'CONFIRMED',
          payment_status: 'UNPAID'
        }
      ]);

      if (error) return alert("Error: " + error.message);

      alert(`Booking Confirmed for ${custName} on ${date} @ ${selectedTimeSlot}!`);
      closeSheet();
    }

    loadMarketplace();
  </script>
</body>
</html>
