<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BOOK.NOW — Discover & Book Local Shops</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --primary: #0f172a;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --success: #16a34a;
      --radius: 20px;
      --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 10px 30px -5px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; padding: 0; background: var(--bg); color: var(--text); padding-bottom: 70px; }

    /* TOP NAVIGATION */
    .top-nav { 
      background: rgba(255, 255, 255, 0.95); 
      backdrop-filter: blur(12px);
      padding: 14px 20px; 
      border-bottom: 1px solid var(--border); 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      position: sticky; 
      top: 0; 
      z-index: 30; 
    }
    .brand { font-size: 18px; font-weight: 800; display: flex; align-items: center; gap: 8px; color: var(--primary); letter-spacing: -0.5px; }
    .partner-link { font-size: 12px; font-weight: 700; color: #fff; text-decoration: none; background: var(--accent); padding: 8px 14px; border-radius: 10px; transition: background 0.2s; }
    .partner-link:hover { background: var(--accent-hover); }

    .container { padding: 20px 16px; max-width: 680px; margin: 0 auto; }

    /* HERO & SEARCH */
    .hero { margin-bottom: 20px; }
    .hero-badge { display: inline-flex; align-items: center; gap: 6px; background: #eff6ff; color: var(--accent); font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 20px; margin-bottom: 10px; text-transform: uppercase; }
    .hero h1 { font-size: 26px; font-weight: 800; margin: 0 0 6px 0; letter-spacing: -0.8px; color: var(--primary); }
    .hero p { font-size: 14px; color: var(--muted); margin: 0 0 16px 0; line-height: 1.4; }

    .search-box { position: relative; margin-bottom: 16px; }
    .search-box i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 18px; color: var(--muted); }
    .search-input { width: 100%; padding: 12px 14px 12px 42px; border-radius: 14px; border: 1px solid var(--border); background: var(--surface); font-size: 14px; outline: none; box-shadow: var(--shadow-sm); transition: border 0.2s; }
    .search-input:focus { border-color: var(--accent); }

    /* FILTER CHIPS */
    .filter-bar { display: flex; gap: 8px; margin-bottom: 24px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
    .filter-bar::-webkit-scrollbar { display: none; }
    .filter-chip { background: var(--surface); border: 1px solid var(--border); padding: 8px 16px; border-radius: 20px; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap; color: var(--muted); transition: all 0.2s; display: flex; align-items: center; gap: 6px; }
    .filter-chip.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 4px 12px rgba(15,23,42,0.15); }

    /* STORE CARDS GRID */
    .store-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
    .store-card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); overflow: hidden; box-shadow: var(--shadow-sm); transition: transform 0.2s, box-shadow 0.2s; }
    .store-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }

    .store-cover { width: 100%; height: 160px; object-fit: cover; background: #e2e8f0; display: block; }
    .store-body { padding: 16px; }

    .store-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
    .store-title { font-size: 18px; font-weight: 800; margin: 0; color: var(--primary); letter-spacing: -0.3px; }
    .store-category { font-size: 10px; font-weight: 800; background: #f1f5f9; color: var(--muted); padding: 4px 8px; border-radius: 6px; text-transform: uppercase; letter-spacing: 0.5px; }

    .store-meta { display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--muted); margin-bottom: 16px; }
    .store-rating { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; color: #d97706; }

    .btn-visit { width: 100%; background: #f1f5f9; color: var(--primary); border: 1px solid var(--border); padding: 10px; border-radius: 12px; font-size: 13px; font-weight: 700; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-visit:hover { background: var(--primary); color: #fff; border-color: var(--primary); }

    /* STORE MENU MODAL */
    .modal { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(6px); display: none; justify-content: center; align-items: flex-end; z-index: 100; }
    .modal-sheet { background: #fff; width: 100%; max-width: 620px; padding: 24px; border-radius: 24px 24px 0 0; max-height: 85vh; overflow-y: auto; box-shadow: 0 -10px 30px rgba(0,0,0,0.15); }

    .sheet-cover { width: 100%; height: 140px; object-fit: cover; border-radius: 16px; margin-bottom: 14px; }
    .service-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #f1f5f9; }
    .service-row:last-child { border-bottom: none; }
    .service-info { font-size: 14px; font-weight: 700; color: var(--primary); }
    .service-duration { font-size: 11px; color: var(--muted); margin-top: 2px; }

    .service-price-book { display: flex; align-items: center; gap: 12px; }
    .service-price { font-weight: 800; color: var(--primary); font-size: 15px; }
    .btn-book { background: var(--accent); color: white; border: none; padding: 8px 16px; border-radius: 10px; font-size: 12px; font-weight: 700; cursor: pointer; }

    .form-field { margin-bottom: 14px; }
    .form-field label { display: block; font-size: 11px; font-weight: 700; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; }
    .form-field input { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--border); font-size: 14px; outline: none; }

    .empty-box { text-align: center; padding: 40px 16px; background: var(--surface); border-radius: 16px; border: 1px dashed var(--border); color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>

  <!-- TOP NAV -->
  <div class="top-nav">
    <div class="brand">
      <i class="ph ph-calendar-check" style="font-size:24px; color: var(--accent);"></i>
      BOOK.NOW
    </div>
    <a href="vendor.html" class="partner-link">Partner Portal</a>
  </div>

  <div class="container">
    <!-- HERO SECTION -->
    <div class="hero">
      <div class="hero-badge"><i class="ph ph-sparkle"></i> Verified Local Vendors</div>
      <h1>Explore Local Spots</h1>
      <p>Discover top-rated barbershops, beauty salons, and braai spots.</p>

      <!-- SEARCH BAR -->
      <div class="search-box">
        <i class="ph ph-magnifying-glass"></i>
        <input type="text" id="search-input" class="search-input" placeholder="Search by shop name, service, or category...">
      </div>
    </div>

    <!-- CATEGORY FILTER CHIPS -->
    <div class="filter-bar">
      <button class="filter-chip active" id="filter-all"><i class="ph ph-squares-four"></i> All Spots</button>
      <button class="filter-chip" id="filter-barber"><i class="ph ph-scissors"></i> Barbershops</button>
      <button class="filter-chip" id="filter-salon"><i class="ph ph-sparkles"></i> Salons</button>
      <button class="filter-chip" id="filter-shisanyama"><i class="ph ph-fire"></i> Shisanyama</button>
    </div>

    <!-- STORE GRID -->
    <div id="store-grid" class="store-grid">
      <div class="empty-box">Loading available stores...</div>
    </div>
  </div>

  <!-- STORE DETAIL / MENU MODAL -->
  <div id="store-modal" class="modal">
    <div class="modal-sheet">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <h3 id="store-modal-name" style="margin:0; font-size:20px; font-weight:800;">Business Name</h3>
        <i class="ph ph-x-circle" id="close-store-modal" style="font-size:26px; color:var(--muted); cursor:pointer;"></i>
      </div>
      <img id="store-modal-img" src="" alt="Cover" class="sheet-cover">
      <div style="font-size:12px; font-weight:700; color:var(--muted); text-transform:uppercase; margin-bottom:10px;">Services & Menu</div>
      <div id="store-modal-services"></div>
    </div>
  </div>

  <!-- BOOKING FORM MODAL -->
  <div id="booking-modal" class="modal">
    <div class="modal-sheet">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <div>
          <span style="font-size:11px; font-weight:700; color:var(--accent); text-transform:uppercase;">Complete Appointment</span>
          <h3 id="booking-modal-title" style="margin:2px 0 0 0; font-size:18px; font-weight:800;">Service Title</h3>
        </div>
        <i class="ph ph-x-circle" id="close-booking-modal" style="font-size:26px; color:var(--muted); cursor:pointer;"></i>
      </div>
      <div class="form-field">
        <label for="customer-name">Your Full Name</label>
        <input type="text" id="customer-name" placeholder="e.g. Sipho Dlamini">
      </div>
      <div class="form-field">
        <label for="customer-phone">Phone Number (WhatsApp)</label>
        <input type="tel" id="customer-phone" placeholder="e.g. 082 123 4567">
      </div>
      <button class="btn-book" id="confirm-booking-btn" style="width:100%; padding:14px; font-size:14px; margin-top:8px;">Confirm Booking</button>
    </div>
  </div>

  <script>
  (() => {
    "use strict";

    const SUPABASE_URL = "https://pvplhsiafklaoqrpdhpd.supabase.co";
    const SUPABASE_KEY = "sb_publishable_VKlDPkR9JvJr6E4bcz1HSg_OG5_xy5r";
    
    let supabase = null;
    let allVendors = [];
    let selectedService = null;
    let booted = false;

    // High-resolution category imagery
    const FALLBACK_IMAGES = {
      BARBER: "https://images.unsplash.com/photo-1503951914875-452162b0f3f1?auto=format&fit=crop&w=800&q=80",
      SALON: "https://images.unsplash.com/photo-1560066984-138dadb4c035?auto=format&fit=crop&w=800&q=80",
      SHISANYAMA: "https://images.unsplash.com/photo-1555939594-58d7cb561ad1?auto=format&fit=crop&w=800&q=80",
      DEFAULT: "https://images.unsplash.com/photo-1521590832167-7bcbfaa6381f?auto=format&fit=crop&w=800&q=80"
    };

    const $ = id => document.getElementById(id);

    function bindEvents() {
      $("close-store-modal").addEventListener("click", () => $("store-modal").style.display = "none");
      $("close-booking-modal").addEventListener("click", () => $("booking-modal").style.display = "none");

      $("filter-all").addEventListener("click", (e) => filterCategory("ALL", e.currentTarget));
      $("filter-barber").addEventListener("click", (e) => filterCategory("BARBER", e.currentTarget));
      $("filter-salon").addEventListener("click", (e) => filterCategory("SALON", e.currentTarget));
      $("filter-shisanyama").addEventListener("click", (e) => filterCategory("SHISANYAMA", e.currentTarget));

      $("search-input").addEventListener("input", handleSearch);
      $("confirm-booking-btn").addEventListener("click", confirmBooking);
    }

    async function loadMarketplace() {
      const container = $("store-grid");
      container.innerHTML = '<div class="empty-box">Loading available stores...</div>';

      if (!window.supabase || !supabase) {
        container.textContent = "Unable to connect to database. Please refresh.";
        return;
      }

      try {
        // Query existing columns safely
        const { data: vendors, error } = await supabase
          .from("vendors")
          .select("id, name, category, created_at")
          .order("created_at", { ascending: false });

        if (error) throw error;

        if (!vendors || vendors.length === 0) {
          allVendors = [];
          container.innerHTML = '<div class="empty-box">No partner spots available yet.</div>';
          return;
        }

        const results = await Promise.all(
          vendors.map(async vendor => {
            const { data: services, error: serviceError } =
              await supabase
                .from("service_items")
                .select("id, vendor_id, title, price")
                .eq("vendor_id", vendor.id);

            if (serviceError) throw serviceError;

            return {
              ...vendor,
              service_items: services || []
            };
          })
        );

        allVendors = results;
        renderStores(allVendors);

      } catch (error) {
        console.error("Marketplace error:", error);
        container.replaceChildren();
        const message = document.createElement("div");
        message.className = "empty-box";
        message.textContent = "Marketplace error: " + (error.message || "Unknown error");
        container.appendChild(message);
      }
    }

    function renderStores(vendors) {
      const container = $("store-grid");
      container.replaceChildren();

      if (vendors.length === 0) {
        container.innerHTML = '<div class="empty-box">No spots found matching your search.</div>';
        return;
      }

      vendors.forEach(v => {
        const card = document.createElement("div");
        card.className = "store-card";

        const img = document.createElement("img");
        img.className = "store-cover";
        img.src = FALLBACK_IMAGES[v.category] || FALLBACK_IMAGES.DEFAULT;
        img.alt = v.name;

        const body = document.createElement("div");
        body.className = "store-body";

        const header = document.createElement("div");
        header.className = "store-header";

        const title = document.createElement("h3");
        title.className = "store-title";
        title.textContent = v.name || "Unnamed Business";

        const category = document.createElement("span");
        category.className = "store-category";
        category.textContent = v.category || "SPOT";

        header.append(title, category);

        const meta = document.createElement("div");
        meta.className = "store-meta";
        meta.innerHTML = `
          <span class="store-rating"><i class="ph-fill ph-star"></i> 5.0</span>
          <span>•</span>
          <span>${v.service_items.length} Service${v.service_items.length === 1 ? '' : 's'} Available</span>
        `;

        const visitBtn = document.createElement("button");
        visitBtn.className = "btn-visit";
        visitBtn.innerHTML = `<i class="ph ph-storefront"></i> Visit Store`;
        visitBtn.addEventListener("click", () => openStoreModal(v));

        body.append(header, meta, visitBtn);
        card.append(img, body);
        container.appendChild(card);
      });
    }

    function openStoreModal(vendor) {
      $("store-modal-name").textContent = vendor.name;
      $("store-modal-img").src = FALLBACK_IMAGES[vendor.category] || FALLBACK_IMAGES.DEFAULT;

      const servicesContainer = $("store-modal-services");
      servicesContainer.replaceChildren();

      if (vendor.service_items && vendor.service_items.length > 0) {
        vendor.service_items.forEach(s => {
          const row = document.createElement("div");
          row.className = "service-row";

          const details = document.createElement("div");
          const info = document.createElement("div");
          info.className = "service-info";
          info.textContent = s.title;

          const duration = document.createElement("div");
          duration.className = "service-duration";
          duration.textContent = "⏱️ ~30 mins";

          details.append(info, duration);

          const right = document.createElement("div");
          right.className = "service-price-book";

          const price = document.createElement("span");
          price.className = "service-price";
          price.textContent = `R${Number(s.price).toFixed(2)}`;

          const bookBtn = document.createElement("button");
          bookBtn.className = "btn-book";
          bookBtn.textContent = "Book";
          bookBtn.addEventListener("click", () => {
            $("store-modal").style.display = "none";
            openBookingModal(vendor.id, s.id, s.title, s.price);
          });

          right.append(price, bookBtn);
          row.append(details, right);
          servicesContainer.appendChild(row);
        });
      } else {
        servicesContainer.innerHTML = '<div style="font-size:13px; color:var(--muted); padding:16px 0;">No services published by this vendor yet.</div>';
      }

      $("store-modal").style.display = "flex";
    }

    function openBookingModal(vendorId, serviceId, title, price) {
      selectedService = { vendorId, serviceId, title, price };
      $("booking-modal-title").textContent = `${title} (R${price.toFixed(2)})`;
      $("booking-modal").style.display = "flex";
    }

    function handleSearch(e) {
      const term = e.target.value.toLowerCase().trim();
      if (!term) {
        renderStores(allVendors);
        return;
      }

      const filtered = allVendors.filter(v => {
        const matchName = v.name.toLowerCase().includes(term);
        const matchCategory = v.category.toLowerCase().includes(term);
        const matchService = v.service_items.some(s => s.title.toLowerCase().includes(term));
        return matchName || matchCategory || matchService;
      });

      renderStores(filtered);
    }

    function filterCategory(cat, btn) {
      document.querySelectorAll(".filter-chip").forEach(c => c.classList.remove("active"));
      btn.classList.add("active");

      if (cat === "ALL") {
        renderStores(allVendors);
      } else {
        const filtered = allVendors.filter(v => v.category === cat);
        renderStores(filtered);
      }
    }

    async function confirmBooking() {
      const name = $("customer-name").value.trim();
      const phone = $("customer-phone").value.trim();
      const button = $("confirm-booking-btn");

      if (!name || !phone) return alert("Please enter your name and phone number.");
      if (!selectedService) return;

      button.disabled = true;
      button.textContent = "Submitting...";

      try {
        const grossAmount = selectedService.price;
        const netEarnings = grossAmount * 0.90;

        const { error } = await supabase.from("orders").insert([{
          vendor_id: selectedService.vendorId,
          gross_amount: grossAmount,
          vendor_net_earnings: netEarnings,
          status: "PENDING",
          customer_name: name,
          customer_phone: phone
        }]);

        if (error) throw error;

        alert(`Booking request sent for ${name}! The shop has received your appointment.`);
        $("booking-modal").style.display = "none";
        $("customer-name").value = "";
        $("customer-phone").value = "";
        selectedService = null;

      } catch (error) {
        console.error("Booking error:", error);
        alert("Could not submit booking: " + error.message);
      } finally {
        button.disabled = false;
        button.textContent = "Confirm Booking";
      }
    }

    function boot() {
      if (booted) return;
      booted = true;

      try {
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        bindEvents();
        loadMarketplace();
      } catch (e) {
        console.error("Boot error:", e);
      }
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", boot, { once: true });
    } else {
      boot();
    }
  })();
  </script>
</body>
</html>
